services:
  db:
    # The official Postgres 15 image with pgvector added — same major version, so
    # the existing postgres-data volume reads unchanged. The chatbot's knowledge
    # base needs the `vector` extension, which postgres:15-alpine does not carry.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  postgres-data:
