  /chat/unanswered:
    get:
      summary: Get Unanswered Questions
      deprecated: false
      description: 'The demand signal, and the screen this feature exists for. **It returns themes, not messages.** Fifty shoppers asking for earbuds type fifty different sentences, and a list of fifty rows is not a signal — "wireless earbuds, 45 times" is. Grouping runs in two passes: a deterministic one that always runs (normalise, drop stop words, sort the tokens, group), and a nightly semantic one over the same embeddings the knowledge base uses, which is what pulls "earbuds", "airpods" and "سماعات لاسلكية" onto one line. If the embedding service is unavailable the grouping is coarser, never an error. Render `label` as the heading, `occurrences` as the count and `exampleQuestion` as the quote underneath. Note that grouping does **not** stem: "handbag" and "handbags" are two themes until the nightly pass merges them. Only turns the assistant resolved as `unanswered` reach this feed — an off-topic question never does, which is the whole point of the distinction.'
      tags:
        - Chatbot / Insights
      parameters:
        - name: page
          in: query
          description: Defaults to 1.
          required: false
          example: '1'
          schema:
            type: integer
        - name: limit
          in: query
          description: 'Defaults to 20, max 100. Paginates the groups, not the questions.'
          required: false
          example: '20'
          schema:
            type: integer
        - name: days
          in: query
          description: 'The window, in days. Defaults to 30, min 1, max 365.'
          required: false
          example: '30'
          schema:
            type: integer
        - name: includeReviewed
          in: query
          description: 'Defaults to false. A reviewed theme has been dealt with and is noise; set true to audit what was reviewed.'
          required: false
          example: 'false'
          schema:
            type: boolean
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'Groups ordered by `occurrences` descending, then most recently asked. `messageIds` are the rows behind the theme — pass **any one** of them to the review route and all of them are marked. At most 200 groups per window.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: 'One **theme**, not one message.'
                      properties:
                        key:
