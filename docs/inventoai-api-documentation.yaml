          headers: {}
        '401':
          description: 'A token was sent and it does not verify. Deliberately **not** a quiet downgrade to anonymous — refresh and retry. Sending no header at all is the anonymous path and is never a 401.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Invalid or expired access token
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: 'The token belongs to another store, or to a platform-level OWNER rather than a customer of this one.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: This account belongs to another store
                error: Forbidden
                statusCode: 403
          headers: {}
        '404':
          description: 'No live store with that slug, **or the owner has switched the assistant off** — those are deliberately indistinguishable. An unknown `sessionId` is also a 404.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Cannot POST /site/layali/chat
                error: Not Found
                statusCode: 404
          headers: {}
        '429':
          description: 'The rate limit, keyed on the **caller** — the signed-in user, or the request IP when there is none. Omitting `sessionId` does not open a fresh counter. The message names the seconds left.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'Names the seconds left, so the client can render a countdown rather than a guess.'
                  statusCode:
                    type: integer
                required:
                  - message
                  - statusCode
              example:
                message: 'That is a lot of questions at once — please wait 47 seconds'
                statusCode: 429
          headers: {}
      security: []
  /site/{slug}/chat/{sessionId}:
    get:
      summary: Get Chat Conversation
      deprecated: false
      description: 'The shopper''s own view of a conversation, oldest first — what the widget re-renders after a reload. The `sessionId` is a **capability**: whoever holds it can read the conversation, which is fine while it is a stranger asking about mugs. It stops being fine once the assistant has read an order''s details back, so a session that has ever been used while signed in additionally requires **that** customer''s token from then on. One consequence worth knowing: a customer who chats anonymously, signs in, and then signs out cannot read their own earlier transcript back. `sources` and `latencyMs` are deliberately absent here — they are the owner''s diagnostics and belong to the dashboard. Conversations are kept for 180 days and then deleted with their messages; say so in the widget.'
      tags:
        - Storefront / Chat
      parameters:
        - name: slug
          in: path
          description: ''
          required: true
          example: layali
          schema:
            type: string
        - name: sessionId
          in: path
          description: ''
          required: true
          example: 067e2f09-0171-41a2-8335-d4f7ae4a42f9
          schema:
            type: string
        - name: Authorization
          in: header
          description: 'Required only if the conversation is bound to a customer account.'
          required: false
          example: Bearer {{access_token}}
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                description: 'The shopper''s own view of a conversation, oldest first — what the widget re-renders after a reload. `sources` and `latencyMs` are deliberately **absent**: they are the owner''s diagnostics and belong to the dashboard.'
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  isSignedIn:
                    type: boolean
                    description: 'True once the conversation has been used while signed in — from then on it requires that customer''s token to read.'
                  messages:
                    type: array
                    description: 'Both halves of every exchange, alternating, oldest first.'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
