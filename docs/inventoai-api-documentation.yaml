                isEnabled: true
                greeting: Welcome to Layali! Ask me about our abayas, an order or our returns policy.
                effectiveGreeting: Welcome to Layali! Ask me about our abayas, an order or our returns policy.
                tone: formal
                contactEmail: help@layali.test
                updatedAt: '2026-08-16T12:31:44.910Z'
          headers: {}
        '400':
          description: 'A greeting over 300 characters or an empty one, a tone outside the enum, a malformed contactEmail, or any field no DTO declares — `storeId` included, which is rejected as `should not exist`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
