  /purchase-requests/{id}/offers/{offerId}/reply:
    post:
      summary: Paste a Supplier's Reply
      deprecated: false
      description: |
        The owner pastes what the supplier wrote; the model reads the price,
        quantity and delivery time out of it.

        **Paste the whole email** — quoted thread and all. Nothing here needs the
        owner to find the numbers, which is the entire point.

        ## The reply is never lost

        `rawReply` is stored **before** the model is called. If the extraction
        fails, the reply is still on the row and `extractionStatus` is `failed` —
        show `rawReply` and prompt the owner to type the three numbers into
        `PATCH …/offers/{offerId}`. Treat a failed extraction as a task, not an
        error: it also happens when the model reads *"250 for 100 pieces, 350 for
        fewer"* and picks the wrong one, which is why the manual route exists
        regardless.

        ## What it does to the row

        * The offer becomes `received` and gains a `repliedAt`.
        * On success: `unitAmount`, `quantity`, `deliveryDays` and `notes` are
          filled and `extractionStatus` is `parsed`.
        * The request flips `sent → replied` on the **first** reply. A second
          supplier answering is not a transition and changes nothing.

        ## Two conversions the model does not do

        The model is asked for a price in **major** units — it reads "235 EGP
        each" and returns `235` — and the server multiplies to `23500`. Asking a
        model for minor units gets `235` anyway, and that is a hundredfold error
        in the one table an owner spends money from. "Two weeks" likewise becomes
        `deliveryDays: 14` in code.

        ## When it refuses

        A reply on a request that has **not been sent** is a `400` — a reply to a
        request nobody sent is not a reply to anything. So is one on a `confirmed`
        or `cancelled` request.

        ## The automatic path

        When the owner has connected their mailbox, replies to watched offers
        arrive on their own within a few minutes and this route is the fallback.
        It stays available always — a grant can be revoked, and Google's testing
        mode expires refresh tokens weekly.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: 'The purchase request.'
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: offerId
          in: path
          description: 'The offer belonging to the supplier who replied.'
          required: true
          example: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: 'The supplier''s email, pasted whole. Quoted thread and signature are fine — long enough for a quotation with the conversation under it.'
              required:
                - body
            example:
              body: |-
                Hello,

                Thank you for your enquiry. We can supply the Linen Summer Abaya at 235 EGP each. We have 15 units in stock and delivery takes eight days. We can hold this price for 30 days.

                Best regards,
                Nile Textiles
        required: true
      responses:
        '200':
          description: 'The **whole request**, re-ranked — not just the one offer. A new price moves every other row, so a client handed only its own row would draw a stale table.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productTitle: Linen Summer Abaya
                quantity: 18
                neededWithinDays: 10
                status: replied
                offerCount: 2
                receivedCount: 1
                confirmedOfferId: null
                offers:
                  - id: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
                    supplierName: Nile Textiles
                    supplierEmail: sales@niletextiles.test
                    status: received
                    unitAmount: 23500
                    quantity: 15
                    deliveryDays: 8
                    notes: Can hold this price for 30 days.
                    rawReply: 'Hello, Thank you for your enquiry. We can supply the Linen Summer Abaya at 235 EGP each...'
                    extractionStatus: parsed
                    repliedAt: '2026-08-17T16:39:44.010Z'
                    totalAmount: 352500
                    rank: 1
                    isRecommended: true
                    isCheapest: true
                    isFastest: true
                    isLate: false
                    isWatched: false
                  - id: 4a1c9f77-2b0e-4c6a-9f10-6d2b7c8e5a31
                    supplierName: Cairo Fabric House
                    status: awaiting
                    unitAmount: null
                    extractionStatus: null
                    totalAmount: null
                    rank: null
                    isRecommended: false
                    isWatched: false
          headers: {}
        '400':
          description: 'The request has not been sent yet, or is `confirmed`/`cancelled`; or an empty or oversized body.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: 'A reply can only be recorded on a request that has been sent; this one is draft'
                error: Bad Request
                statusCode: 400
          headers: {}
        '404':
          description: 'Unknown request or offer, an offer that belongs to another request, or another store''s row.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Offer not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /purchase-requests/{id}/offers/{offerId}:
    patch:
      summary: Correct an Offer's Numbers
      deprecated: false
      description: |
        The owner's own reading of a reply — what fixes a failed extraction, and
        what corrects a model that picked the wrong number out of two.

        Whatever is written here stamps `extractionStatus: manual`. **The owner's
        numbers win**, and the dashboard should say so.

        ## Money is minor units

        `unitAmount` is what the owner typed **multiplied by 100** —
        `235.00 EGP` is `23500`. Do the multiplication in the form, validate that
        it is a whole number, and never send a decimal. This is the single most
        expensive mistake available in this feature.

        ## It also works on an unanswered offer

        Patching an `awaiting` offer flips it to `received` and stamps
        `repliedAt` — which is what an owner does when a supplier phones instead
        of writing. Send `null` to clear any field back to unknown; an offer with
        no `unitAmount` becomes unrankable again rather than a deal worth zero.

        Refused once the request is `confirmed` or `cancelled` (**409**) — the
        deal is done.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: offerId
          in: path
          description: ''
          required: true
          example: 4a1c9f77-2b0e-4c6a-9f10-6d2b7c8e5a31
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unitAmount:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  nullable: true
                  description: '**Minor units** — `235.00 EGP` is `23500`. Send `null` to clear, which makes the offer unrankable again.'
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100000
                  nullable: true
                  description: 'What the supplier actually offered. Null falls back to the request''s own quantity when the total is computed.'
                deliveryDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                  nullable: true
                  description: 'Days. `0` is allowed here — a supplier with it in stock today.'
                notes:
                  type: string
                  maxLength: 500
                  nullable: true
            example:
              unitAmount: 21000
              quantity: 18
              deliveryDays: 21
              notes: Quoted by phone; confirmed three weeks.
        required: true
      responses:
        '200':
          description: 'The whole request, re-ranked. The edited offer now reads `extractionStatus: manual`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                status: replied
                quantity: 18
                neededWithinDays: 10
                offerCount: 2
                receivedCount: 2
                offers:
                  - id: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
                    supplierName: Nile Textiles
                    status: received
                    unitAmount: 23500
                    quantity: 15
                    deliveryDays: 8
                    extractionStatus: parsed
                    totalAmount: 352500
                    rank: 1
                    isRecommended: true
                    isCheapest: false
                    isFastest: true
                    isLate: false
                  - id: 4a1c9f77-2b0e-4c6a-9f10-6d2b7c8e5a31
                    supplierName: Cairo Fabric House
                    status: received
                    unitAmount: 21000
                    quantity: 18
                    deliveryDays: 21
                    notes: Quoted by phone; confirmed three weeks.
                    extractionStatus: manual
                    totalAmount: 378000
                    rank: 2
                    isRecommended: false
                    isCheapest: true
                    isFastest: false
                    isLate: true
          headers: {}
        '400':
          description: 'A negative or zero price, a decimal, a bound broken, or `storeId` in the body.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message:
                  - unitAmount must not be less than 1
                error: Bad Request
                statusCode: 400
          headers: {}
        '409':
          description: 'The request is `confirmed` or `cancelled`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: An offer cannot be edited once the request is confirmed
                error: Conflict
                statusCode: 409
          headers: {}
        '404':
          description: 'Unknown request or offer, or another store''s row.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Offer not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /purchase-requests/{id}/offers/{offerId}/confirm:
    post:
      summary: Confirm an Offer (close the deal)
      deprecated: false
      description: |
        The owner picks one. No body.

        This is the end of the feature, and it does four things in one
        transaction:

        1. The chosen offer becomes **`won`**.
        2. Every other offer becomes **`declined`**.
        3. The request becomes **`confirmed`** — terminal — with `confirmedAt`
           and `confirmedOfferId` set.
        4. Two emails go out **after** the transaction commits: a confirmation to
           the winner quoting the agreed price, quantity and delivery time, and a
           polite decline to everyone else.

        ## What the emails say

        The decline gives **no reason and no comparison** — not the winning
        price, not how many others were asked. A supplier who lost this month is
        one the store wants a quote from next month.

        A supplier who was never actually emailed is **not** sent a decline —
        they would be declined for a request they never received — but their
        offer row is still marked `declined`, because the owner did decide.

        A decline that fails to send is a logged warning, never a rolled-back
        deal: the owner's decision is recorded either way, and an email is
        re-sendable where a decision is not.

        ## When it refuses

        * **An offer with no `unitAmount` → 400.** You cannot pick a deal that has
          no price. Disable the confirm button on any row where `unitAmount` is
          null; if the supplier quoted by phone, use the correction route first.
        * Already `confirmed` or `cancelled` → **400** (both terminal).
        * Two owners confirming different offers at once → the loser gets a
          **409** and should reload. One deal is struck, never two.

        ## Nothing happens to stock

        A confirmed deal does **not** increment `stockQuantity`. Nothing here
        knows the goods arrived — that is goods receipt, and it is not built.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: offerId
          in: path
          description: 'The winning offer. Must have a `unitAmount`.'
          required: true
          example: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'The deal: one `won`, the rest `declined`, the request `confirmed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productTitle: Linen Summer Abaya
                variantLabel: 'Size: M, Colour: Navy'
                quantity: 18
                status: confirmed
                offerCount: 2
                receivedCount: 2
                sentAt: '2026-08-17T16:27:29.888Z'
                confirmedAt: '2026-08-17T17:02:55.318Z'
                confirmedOfferId: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
                offers:
                  - id: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
                    supplierName: Nile Textiles
                    supplierEmail: sales@niletextiles.test
                    status: won
                    unitAmount: 23500
                    quantity: 15
                    deliveryDays: 8
                    extractionStatus: parsed
                    decidedAt: '2026-08-17T17:02:55.318Z'
                    totalAmount: 352500
                    rank: 1
                    isRecommended: true
                    isCheapest: false
                    isFastest: true
                    isLate: false
                  - id: 4a1c9f77-2b0e-4c6a-9f10-6d2b7c8e5a31
                    supplierName: Cairo Fabric House
                    supplierEmail: orders@cairofabric.test
                    status: declined
                    unitAmount: 21000
                    quantity: 18
                    deliveryDays: 21
                    extractionStatus: manual
                    decidedAt: '2026-08-17T17:02:55.318Z'
                    totalAmount: 378000
                    rank: 2
                    isRecommended: false
                    isCheapest: true
                    isFastest: false
                    isLate: true
          headers: {}
        '400':
          description: 'The offer has no price, or the request is already `confirmed`/`cancelled`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: 'This offer has no price yet — ask the supplier for one, or enter it yourself'
                error: Bad Request
                statusCode: 400
          headers: {}
        '409':
          description: 'Somebody else confirmed this request first. Reload it — one deal was struck, not two.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: 'This purchase request was updated by someone else, please reload it'
                error: Conflict
                statusCode: 409
          headers: {}
        '404':
          description: 'Unknown request or offer, an offer of another request, or another store''s row.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Offer not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /mailbox:
    get:
      summary: Mailbox Connection Status
      deprecated: false
      description: |
        Everything the settings panel needs to draw itself. Call it first; the
        answer decides whether there is a panel at all.

        ## Read the three states in this order

        1. **`isSupported: false`** → **render nothing.** This server has no
           Google client secret, so there is no feature to offer. Not a disabled
           button, not an error banner — the supplier flow simply works over SMTP
           with pasted replies, which is a supported way to run it.
        2. **`isSupported: true, isConnected: false`** → show the Connect button.
        3. **`isConnected: true`** → show the connected address, and check
           `status`.

        ## `status` is where the trouble shows

        * `connected` — working. `isSyncing` is true and replies arrive on their
          own.
        * `revoked` — **Google's answer.** The owner withdrew access, changed
          their password, or the refresh token lapsed. Show `lastError` and a
          Reconnect button.
        * `expired` — **our answer.** The stored credential can no longer be read
           on this server, which is what a rotated encryption key looks like. Same
           Reconnect button, but do not send the owner hunting through their
           Google security settings for a revocation that never happened.

        **Expect `revoked` regularly.** While the app is in Google's *testing*
        publishing status, refresh tokens expire about every **7 days** by design.
        Treat reconnection as routine housekeeping, not an incident — and note
        that pasting replies keeps working throughout, so nothing is blocked.

        Allowed for **OWNER and ADMIN**: an admin who runs the supplier desk needs
        to see why replies stopped arriving, even though they cannot connect one.
      tags:
        - Supplier Mailbox
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{owner_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'The panel''s state. Never a 404 — "not connected" is an ordinary answer.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSupported:
                    type: boolean
                    description: 'Whether this **server** can offer mailbox sending at all. False means no client secret is configured — hide the entire panel.'
                  isConnected:
                    type: boolean
                    description: 'Whether this **store** has connected a mailbox.'
                  provider:
                    type: string
                    nullable: true
                    enum:
                      - gmail
                    description: 'Which mailbox provider. Gmail is the only adapter today; Outlook and IMAP are the reason this field exists.'
                  accountEmail:
                    type: string
                    format: email
                    nullable: true
                    description: 'The address purchase requests are sent **from**. Show it — an owner with several Google accounts needs to see which one is attached.'
                  status:
                    type: string
                    nullable: true
                    enum:
                      - connected
                      - expired
                      - revoked
                    description: 'Null when nothing is connected. See the description above for what each means.'
                  scopes:
                    type: array
                    items:
                      type: string
                    description: 'What Google actually granted, which is not always what was asked for.'
                  isSyncing:
                    type: boolean
                    description: 'True only when the connection is usable and the server supports it — i.e. replies really are being read automatically right now.'
                  lastSyncedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'When the last pass ran, successful or not. The pass runs every 10 minutes.'
                  lastError:
                    type: string
                    nullable: true
                    maxLength: 500
                    description: 'The sentence to show when something is wrong. Null when the last pass was clean.'
                  connectedAt:
                    type: string
                    format: date-time
                    nullable: true
                required:
                  - isSupported
                  - isConnected
                  - provider
                  - accountEmail
                  - status
                  - scopes
                  - isSyncing
                  - lastSyncedAt
                  - lastError
                  - connectedAt
              examples:
                connected:
                  summary: Connected and reading replies
                  value:
                    isSupported: true
                    isConnected: true
                    provider: gmail
                    accountEmail: owner@layali.test
                    status: connected
                    scopes:
                      - https://www.googleapis.com/auth/gmail.send
                      - https://www.googleapis.com/auth/gmail.readonly
                    isSyncing: true
                    lastSyncedAt: '2026-08-17T17:10:00.482Z'
                    lastError: null
                    connectedAt: '2026-08-10T08:22:41.119Z'
                notConnected:
                  summary: Supported, nothing connected — show the Connect button
                  value:
                    isSupported: true
                    isConnected: false
                    provider: null
                    accountEmail: null
                    status: null
                    scopes: []
                    isSyncing: false
                    lastSyncedAt: null
                    lastError: null
                    connectedAt: null
                notSupported:
                  summary: The server does not offer this — render no panel
                  value:
                    isSupported: false
                    isConnected: false
                    provider: null
                    accountEmail: null
                    status: null
                    scopes: []
                    isSyncing: false
                    lastSyncedAt: null
                    lastError: null
                    connectedAt: null
                revoked:
                  summary: The grant died — show Reconnect and the sentence
                  value:
                    isSupported: true
                    isConnected: true
                    provider: gmail
                    accountEmail: owner@layali.test
                    status: revoked
                    scopes:
                      - https://www.googleapis.com/auth/gmail.send
                      - https://www.googleapis.com/auth/gmail.readonly
                    isSyncing: false
                    lastSyncedAt: '2026-08-17T17:10:00.482Z'
                    lastError: 'The mailbox grant is no longer valid: invalid_grant — reconnect the mailbox to resume automatic replies'
                    connectedAt: '2026-08-10T08:22:41.119Z'
          headers: {}
        '401':
          description: 'No token, or one that does not verify.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: 'A USER token.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
      security: []
    delete:
      summary: Disconnect Mailbox
      deprecated: false
      description: |
        Forgets the stored grant. No body. **OWNER only.**

        What survives: requests already sent keep their thread ids, so
        reconnecting later picks their replies up again rather than starting
        over. And the paste route never stopped working — which is what the
        response message says, and what the UI should repeat.

        ## It does not revoke the grant at Google

        Deleting our copy of the token is enough to stop this app using it, but
        the consent stays live in the owner's Google account until they withdraw
        it there. That is deliberate: the same OAuth client backs **Google
        Sign-In**, so calling Google's revoke endpoint could take away the login
        the owner signs in with. If they want a full revocation, point them at
        their Google account's third-party access settings.

        Disconnecting when nothing is connected is a normal `200`.
      tags:
        - Supplier Mailbox
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{owner_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'Disconnected. Replies now arrive by paste.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Mailbox disconnected. Supplier replies can still be pasted in by hand.
          headers: {}
        '403':
          description: 'An ADMIN or USER token. Only the OWNER may detach a mailbox.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
      security: []
  /mailbox/connect:
    post:
      summary: Start the Mailbox Consent
      deprecated: false
      description: |
        Step one of two. No body. **OWNER only.**

        Returns the Google consent URL to send the browser to, and the `state`
        that ties the round trip together.

        ## The whole flow

        ```text
        1. POST /mailbox/connect        → { consentUrl, state }
        2. keep `state`; navigate to `consentUrl`
        3. Google redirects to your GOOGLE_MAILBOX_REDIRECT_URI
             ?code=4/0Ax...&state=<the same state>
        4. your page reads `code` and `state` off the query string
        5. POST /mailbox/callback { code, state }   → the connected panel
        ```

        **Keep the `state`** — in `sessionStorage`, not a variable that a page
        navigation destroys. The server also stores its own copy and compares
        them; a mismatch is a 400 and the flow starts again. It expires after
        **10 minutes**, and starting a new connect replaces it, so do not run two
        at once.

        ## This is a second, separate Google consent

        Do **not** merge it into the Sign-In button and do not ask for it at
        signup. It requests `gmail.send` and `gmail.readonly`, and
        `gmail.readonly` is a *restricted* scope — it belongs on a supplier
        settings screen, behind a button the owner presses deliberately.

        The consent screen will say **"Google hasn't verified this app"** until
        verification is granted. Warn the owner in your own copy so it does not
        look like a phishing page; they continue via *Advanced → Go to …*.

        If the address is already connected, the picker is pre-filled with it, so
        a reconnect does not silently attach a different mailbox.

        ## The 503s are configuration, not failure

        Two different ones, because two different people fix them: no client
        secret configured, or an encryption key this server cannot use. The
        server refuses to *ask* for a grant it could not store safely — checked
        **before** the URL is built, so no consent is ever spent for nothing.
      tags:
        - Supplier Mailbox
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{owner_access_tk}}
          schema:
            type: string
      responses:
        '201':
          description: 'Where to send the owner, and the state to hold on to.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  consentUrl:
                    type: string
                    format: uri
                    description: 'Navigate the browser here. Do not open it in an iframe — Google refuses to render consent in one.'
                  state:
                    type: string
                    description: 'Store it and send it back with the code. The server keeps its own copy for 10 minutes and compares the two.'
                required:
                  - consentUrl
                  - state
              example:
                consentUrl: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent&include_granted_scopes=true&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fgmail.send%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fgmail.readonly&state=o0fxIc6tGqPtgao1r25rs8FwVud9MGJcFzqV86txNrY&response_type=code&client_id=123456789-abcdef.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A4200%2Fdashboard%2Fmailbox%2Fcallback'
                state: o0fxIc6tGqPtgao1r25rs8FwVud9MGJcFzqV86txNrY
          headers: {}
        '403':
          description: 'An ADMIN or USER token. Only the OWNER may attach a mailbox — the grant is to a human''s private mail.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
        '503':
          description: 'The server is not set up for this. Fall back to `GET /mailbox` and hide the panel.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              examples:
                noClient:
                  summary: No Google client secret configured
                  value:
                    message: Mailbox sending is not configured on this server
                    error: Service Unavailable
                    statusCode: 503
                noKey:
                  summary: No usable encryption key — it will not ask for a credential it cannot store safely
                  value:
                    message: This server cannot store mailbox credentials securely, so it will not ask for them
                    error: Service Unavailable
                    statusCode: 503
          headers: {}
      security: []
  /mailbox/callback:
    post:
      summary: Finish the Mailbox Consent
      deprecated: false
      description: |
        Step two of two. **OWNER only.**

        Your redirect page reads `code` and `state` off the query string Google
        appended, and POSTs them here. The server exchanges the code with the
        client secret, stores the refresh token **encrypted**, and records the
        mailbox's current position so the first sync only sees mail that arrives
        *after* the owner connected.

        ## Why this is a POST from your page, not a Google redirect into the API

        The client secret never goes near a browser, and your callback screen
        stays an ordinary authenticated page rather than a public route. Your
        `GOOGLE_MAILBOX_REDIRECT_URI` therefore points at **your frontend**, and
        must match a URI registered in the Google Cloud console character for
        character — a trailing slash is a different URI.

        ## Errors worth handling by name

        * **400, "expired or does not match"** — the `state` is wrong or older
          than 10 minutes. Start again from `POST /mailbox/connect`; do not retry
          this call, the state is single-use and has already been consumed.
        * **400, "did not accept this authorization"** — Google refused the code.
          Usually a reused code (they are one-shot), a redirect URI mismatch, or
          a consent the owner cancelled. Start again.

        On success the response is the same shape `GET /mailbox` returns, so the
        panel can render straight from it.
      tags:
        - Supplier Mailbox
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{owner_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 1024
                  description: 'The one-time authorization code from Google''s redirect. Single-use — a replay is a 400.'
                state:
                  type: string
                  maxLength: 256
                  description: 'The value from `POST /mailbox/connect`, unchanged. Compared server-side in constant time.'
              required:
                - code
                - state
            example:
              code: 4/0AX4XfWh8Z2qk9Yr3Lm7pQvN1sT6uV0wX2yZ3aB4cD5eF6gH7iJ8kL9mN0oP1qR2sT3u
              state: o0fxIc6tGqPtgao1r25rs8FwVud9MGJcFzqV86txNrY
        required: true
      responses:
        '201':
          description: 'Connected. Same shape as `GET /mailbox`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSupported:
                    type: boolean
                  isConnected:
                    type: boolean
                  provider:
                    type: string
                    nullable: true
                  accountEmail:
                    type: string
                    nullable: true
                  status:
                    type: string
                    nullable: true
                  scopes:
                    type: array
                    items:
                      type: string
                  isSyncing:
                    type: boolean
                  lastSyncedAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastError:
                    type: string
                    nullable: true
                  connectedAt:
                    type: string
                    format: date-time
                    nullable: true
              example:
                isSupported: true
                isConnected: true
                provider: gmail
                accountEmail: owner@layali.test
                status: connected
                scopes:
                  - https://www.googleapis.com/auth/gmail.send
                  - https://www.googleapis.com/auth/gmail.readonly
                isSyncing: true
                lastSyncedAt: null
                lastError: null
                connectedAt: '2026-08-17T17:22:08.774Z'
          headers: {}
        '400':
          description: 'The state did not match or expired, or Google refused the code. Start again from `/mailbox/connect`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              examples:
                stateMismatch:
                  summary: Wrong or expired state — the CSRF guard
                  value:
                    message: 'This connection attempt has expired or does not match — please start again'
                    error: Bad Request
                    statusCode: 400
                codeRefused:
                  summary: Google refused the code (reused, or a redirect URI mismatch)
                  value:
                    message: 'Google did not accept this authorization — please try connecting again'
                    error: Bad Request
                    statusCode: 400
                whitelist:
                  summary: storeId in the body
                  value:
                    message:
                      - property storeId should not exist
                    error: Bad Request
                    statusCode: 400
          headers: {}
        '403':
          description: 'An ADMIN or USER token.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
        '503':
          description: 'The server is not configured for this.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Mailbox sending is not configured on this server
                error: Service Unavailable
                statusCode: 503
          headers: {}
      security: []
  /mailbox/sync:
    post:
      summary: Check for Replies Now
      deprecated: false
      description: |
        Reads this store's supplier replies immediately, instead of waiting for
        the next scheduled pass. No body. **OWNER and ADMIN.**

        The "check now" button, for the owner staring at the screen after
        emailing a supplier — the same impulse `POST /knowledge/reindex` serves.
        A pass runs on its own every **10 minutes** regardless, so this is a
        convenience, never a requirement.

        ## It always succeeds

        Every outcome is a `201` with a sentence, including the ones that did
        nothing:

        * nothing connected → *"No mailbox is connected…"*
        * connected, but no request is waiting on a supplier → *"Nothing to
          read…"*. Only requests that are `sent` or `replied` are watched; a
          confirmed or cancelled one is never polled, and a store with none makes
          no call to Google at all.
        * otherwise → how many threads were checked and how many new replies were
          read.

        **Re-fetch the request after a non-zero count** — the offers and their
        ranking will have changed.

        ## What it reads, and what it cannot

        Only the mail threads this store's own purchase requests opened, found by
        the thread id captured when each was sent. It **cannot search the
        mailbox**, and there is no route here that could. Messages the owner sent,
        auto-replies and bounces are skipped, as is a supplier's quoted copy of
        our own request — so the numbers extracted are the ones they typed, not
        the ones we asked for.

        A reply that arrives after the owner corrected an offer by hand
        **supersedes** their numbers: a later email is later information. The
        original text stays in `rawReply`.
      tags:
        - Supplier Mailbox
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{owner_access_tk}}
          schema:
            type: string
      responses:
        '201':
          description: 'What the pass did. Always a 200-class response, even when it did nothing.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              examples:
                read:
                  summary: Replies were read — re-fetch the request
                  value:
                    message: Checked 3 thread(s) and read 1 new reply.
                nothingNew:
                  summary: Nothing new since the last pass
                  value:
                    message: Checked 3 thread(s) and read 0 new replies.
                nothingWaiting:
                  summary: Connected, but no request is awaiting an answer
                  value:
                    message: 'Nothing to read: no sent request is still waiting on a supplier.'
                notConnected:
                  summary: No mailbox connected — this store pastes replies
                  value:
                    message: No mailbox is connected, so there is nothing to read. Paste a reply instead.
          headers: {}
        '401':
          description: 'No token, or one that does not verify.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: 'A USER token.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
      security: []
components:
  schemas:
    SupplierOffer:
      type: object
      description: |
        One row of the comparison table: what a supplier offered, and how it
        compares with the others.

        **The ranking half is computed on every read and stored nowhere**, because
        it is a property of the *set* — one reply arriving moves every other row.
        Do not cache it against an offer id.
      properties:
        id:
          type: string
          format: uuid
          description: 'What the reply, edit and confirm routes take as `offerId`.'
        supplierId:
          type: string
          format: uuid
          nullable: true
          description: 'Null once the supplier has been deleted. The name and email below are snapshots and survive that, which is why history stays readable.'
        supplierName:
          type: string
          description: 'Snapshotted when the request was sent — not a live join.'
        supplierEmail:
          type: string
          format: email
          description: 'Snapshotted when the request was sent.'
        status:
          type: string
          enum:
            - awaiting
            - received
            - won
            - declined
          description: |
            `awaiting` — asked, no answer yet.
            `received` — they answered; the numbers below may still be null if the reply could not be read.
            `won` — the owner picked this one.
            `declined` — the owner picked another.
        unitAmount:
          type: integer
          nullable: true
          description: '**Minor units**, in the store''s currency — `23500` is `235.00 EGP`. Null while nobody has quoted a price. Never a decimal, never a formatted string.'
          example: 23500
        quantity:
          type: integer
          nullable: true
          description: 'What the supplier actually offered, which is not always what was asked for. Null means they did not say — the request''s own `quantity` is used for the total.'
        deliveryDays:
          type: integer
          nullable: true
          description: 'Days, normalised from whatever the supplier wrote — "two weeks" becomes `14`.'
        notes:
          type: string
          maxLength: 500
          nullable: true
          description: 'Anything else worth keeping from the reply — a bulk-price offer, a caveat.'
        rawReply:
          type: string
          nullable: true
          description: 'What the supplier actually wrote, stored **before** anything tried to read it. Show this whenever `extractionStatus` is `failed` — it is what the owner types the three numbers from.'
        extractionStatus:
          type: string
          nullable: true
          enum:
            - parsed
            - failed
            - manual
          description: |
            How the numbers got there. Null while no reply has arrived.

            `parsed` — the model read them.
            `failed` — it could not; `rawReply` is still there and the owner should be prompted to fill them in.
            `manual` — the owner typed or corrected them. Their numbers win.
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: 'Null means this recipient has **never been emailed**, which is what makes `POST /send` re-pressable without bothering anybody twice.'
        repliedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
          description: 'When this offer was won or declined.'
        totalAmount:
          type: integer
          nullable: true
          description: '`unitAmount × (quantity ?? the request''s quantity)`, in **minor units**. Derived on read, never stored. Null when there is no price.'
          example: 3525000
        rank:
          type: integer
          nullable: true
          description: '1-based position among the **priced** offers; `1` is the recommendation. **Null means unrankable** — no price yet — and those rows sort last. An offer with no price is not a deal worth zero.'
        isRecommended:
          type: boolean
          description: 'True for exactly one row: `rank === 1`. Never true for an unpriced offer.'
        isCheapest:
          type: boolean
          description: 'Flagged **separately** from `isRecommended` on purpose — when the recommendation is neither cheapest nor fastest, the owner can see why at a glance instead of wondering whether the sort is broken.'
        isFastest:
          type: boolean
        isLate:
          type: boolean
          description: 'True when `deliveryDays` misses the request''s `neededWithinDays`. Always false when the owner set no deadline. Late offers sort **below** on-time ones however cheap they are.'
        isWatched:
          type: boolean
          description: 'Whether this supplier''s reply will be read automatically, because the request reached them through the owner''s connected mailbox. **False means the owner is the transport** — show the paste box. Never hide the paste box entirely; it is what makes a revoked mailbox grant survivable.'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - supplierId
        - supplierName
        - supplierEmail
        - status
        - unitAmount
        - quantity
        - deliveryDays
        - notes
        - rawReply
        - extractionStatus
        - sentAt
        - repliedAt
        - decidedAt
        - totalAmount
        - rank
        - isRecommended
        - isCheapest
        - isFastest
        - isLate
        - isWatched
        - createdAt
    PurchaseRequestSummary:
      type: object
      description: 'A request as the list shows it: what is being bought, where it is in the machine, and how many suppliers have answered.'
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
          description: 'A link back for reporting only. Null once the product is deleted — the snapshot below is what you render.'
        variantId:
          type: string
          format: uuid
          nullable: true
          description: 'A link back for reporting only.'
        productTitle:
          type: string
          description: '**Snapshotted** when the request was created. Render this, never a re-fetched product — renaming or deleting a product must not rewrite what was ordered.'
        variantLabel:
          type: string
          nullable: true
          description: 'Human-readable options, e.g. `Size: M, Colour: Navy`. Null for a simple product with one variant.'
          example: 'Size: M, Colour: Navy'
        quantity:
          type: integer
          description: 'How many units are being asked for.'
        neededWithinDays:
          type: integer
          nullable: true
          description: 'The deadline an offer is judged against — it is what makes an offer `isLate`. Null means the owner set none, so nothing can be late.'
        subject:
          type: string
          description: 'The email subject, AI-drafted and owner-editable while the request is a draft.'
        body:
          type: string
          description: 'The email body, plain text. AI-drafted and owner-editable while the request is a draft. It greets nobody — `Dear <supplier>,` is added per recipient by the mail template, so one body goes to everyone.'
        note:
          type: string
          maxLength: 500
          nullable: true
          description: 'The owner''s steer for the draft ("ask about bulk pricing"). An input to the model, not part of the email.'
        status:
          type: string
          enum:
            - draft
            - sent
            - replied
            - confirmed
            - cancelled
          description: |
            `draft` — created, editable, **nothing emailed**.
            `sent` — at least one supplier has been emailed. Editing is now a 409.
            `replied` — at least one has answered.
            `confirmed` — a deal was struck. **Terminal.**
            `cancelled` — abandoned. **Terminal.**
        draftStatus:
          type: string
          enum:
            - ai
            - fallback
          description: '`fallback` means Gemini did not answer and `body` is template prose. It is a complete, sendable email that asks the same three questions — not an error, and it needs no banner. The owner can edit it like any other draft.'
        offerCount:
          type: integer
          description: 'How many suppliers were asked. The recipient list *is* the offer list — there is no separate recipients table.'
        receivedCount:
          type: integer
          description: 'How many have actually answered (anything but `awaiting`).'
        sentAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedOfferId:
          type: string
          format: uuid
          nullable: true
          description: 'The winning offer. The confirmed offer **is** the deal — there is no separate purchase-order entity.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - variantId
        - productTitle
        - variantLabel
        - quantity
        - neededWithinDays
        - subject
        - body
        - note
        - status
        - draftStatus
        - offerCount
        - receivedCount
        - sentAt
        - confirmedAt
        - confirmedOfferId
        - createdAt
        - updatedAt
    PurchaseRequestDetail:
      description: |
        The request **with its offers, ranked** — the side-by-side comparison the
        owner picks from.

        Every write route in this group returns this same object, including the
        ones that act on a single offer: a new price re-ranks every other row, so
        a client handed only the row it touched would draw a stale table.

        `offers` arrives **sorted best-first** — render it in order and do not
        re-sort. Unpriced offers come last, in the order they were asked.
      allOf:
        - $ref: '#/components/schemas/PurchaseRequestSummary'
        - type: object
          properties:
            offers:
              type: array
              description: 'Ranked, best deal first. Unpriced rows last.'
              items:
                $ref: '#/components/schemas/SupplierOffer'
          required:
            - offers
  responses: {}
  securitySchemes: {}
servers: []
security: []
