                  value:
                    sessionId: 812d0ca7-dfd5-4736-82dc-901bbbc42380
                    message:
                      id: e6f2b7c8-1a3d-4b5e-8c9f-2d1e0a3b4c5d
                      text: 'Your order #1042 was shipped on Thursday and is on its way — it was paid on delivery terms, so nothing is due until it arrives.'
                      createdAt: '2026-08-16T12:34:20.902Z'
                    resolution: answered
                    products: []
                    faqs: []
                    order:
                      id: 6b1f0e3a-9c2d-4f8b-a7e5-1d0c9b8a7f65
                      orderNumber: 1042
                      status: shipped
                      paymentStatus: unpaid
                      paymentMethod: cod
                      currency: EGP
                      totalAmount: 192700
                      itemCount: 2
                      contactName: Sara Ibrahim
                      contactEmail: shopper.layali@inventoai.test
