                  isEnabled:
                    type: boolean
                    description: 'False hides the widget and makes POST /site/:slug/chat a 404.'
                  greeting:
                    type: string
                    nullable: true
                    description: '**What is stored** — null when the owner has never written one. Bind the editor to this, so it cannot save a default nobody chose.'
                  effectiveGreeting:
                    type: string
                    description: '**What the widget shows** — the stored greeting, or a platform default in the store''s own name. Never null.'
                  tone:
                    type: string
                    enum:
