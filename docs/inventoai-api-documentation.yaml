  /chat/sessions:
    get:
      summary: Get Chat Transcripts
      deprecated: false
      description: 'The owner''s list of conversations their assistant had, newest activity first. `preview` is the shopper''s opening question — it is what makes a list of ids readable. `unansweredCount` is how many turns in that conversation went nowhere. `customerName` and `customerEmail` are `null` for the anonymous majority, and stay `null` if the account is later deleted. `search` is a plain `ILIKE` over the messages of the conversation, **both halves of it** — an owner reading transcripts already knows the phrase they want, so the catalog''s full-text stack is not used here.'
