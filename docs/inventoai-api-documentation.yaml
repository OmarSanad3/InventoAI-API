              description: |
                The whole list, in one transaction. **Send every row, not only the ones that
                moved** — ids you omit keep the positions they had, which can leave two rows
                sharing a position (the tie then breaks on `createdAt`, oldest first).

                Nothing is written unless every id is valid and belongs to this store: an
                unknown, duplicated or foreign id rejects the request and leaves all
                positions untouched.
              properties:
                items:
                  type: array
