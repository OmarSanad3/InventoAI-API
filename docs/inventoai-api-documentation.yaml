openapi: 3.0.1
info:
  title: Default module
  description: ''
  version: 1.0.0
tags:
  - name: "Auth & Account"
    description: "Registration, login, Google Sign-In, JWT refresh, email verification and password reset. Owner and store-scoped variants of each. The Google routes return the same login envelope the password routes do, so there is one session code path regardless of how the user signed in."
  - name: "Site Builder"
    description: "The AI onboarding flow: questionnaire, generation, theme and publish."
  - name: "Store Settings"
    description: "Dashboard edits to the store itself, such as the landing page hero."
  - name: "Catalog / Categories"
    description: "Owner-managed categories. Requires an OWNER or ADMIN token."
  - name: "Catalog / Product Attributes"
    description: "Store-defined attributes and their controlled value lists. Requires an OWNER or ADMIN token."
  - name: "Catalog / AI Setup"
    description: "One Gemini generation proposing the store's categories, attributes and values from the questionnaire it already answered, and the apply that writes what the owner kept. Requires an OWNER or ADMIN token."
  - name: "Catalog / Products"
    description: "Dashboard product CRUD. Requires an OWNER or ADMIN token; sees drafts, archived rows and exact stock."
  - name: "Catalog / Variants"
    description: "Variants of a product: add, edit, delete, and the matrix generator. Every response is the whole product."
  - name: "Catalog / Product Images"
    description: "Product gallery, max 8 images. Every response is the whole product."
  - name: "FAQ"
    description: "Owner-managed FAQ entries for the storefront's /SITENAME/faq page. Requires an OWNER or ADMIN token."
  - name: "Orders"
    description: "The owner's order desk: list, inspect, advance through the status machine, annotate. Requires an OWNER or ADMIN token."
  - name: "Storefront / Site"
    description: "Public store pages resolved by slug. No token."
  - name: "Storefront / Catalog"
    description: "Public product listing, ranked search, autocomplete, detail page and sidebar filters. No token."
  - name: "Storefront / Orders"
    description: "Checkout and the customer's own order history, under /site/:slug. Requires a token belonging to a customer of that store, and every route also filters by the caller's own userId."
  - name: "Storefront / Chat"
    description: "The storefront assistant, under /site/:slug. No login required — a bearer token is read when present and unlocks the caller's own orders, and a token for another store is rejected rather than ignored."
  - name: "Chatbot / Knowledge Base"
    description: "The index the assistant retrieves from: what it holds, and a manual rebuild. Requires an OWNER or ADMIN token."
  - name: "Chatbot / Insights"
    description: "The owner's window onto the assistant: transcripts, the grouped feed of questions it could not answer, counts, and the per-store switches. Requires an OWNER or ADMIN token."
  - name: "Advisor"
    description: "The Daily AI Advisor: the morning brief, its history, acting on a line, and the switches behind it. Every number in a brief is measured from the store's own rows — the model only writes the sentences, so render figures from `payload` and never from `body`. Requires an OWNER or ADMIN token; there is deliberately no storefront equivalent."
  - name: "Suppliers"
    description: "The store's supplier book — the people a purchase request is sent to. Plain CRUD, deliberately: one supplier per email per store, soft-deleted so a past deal keeps the name of who offered it. Requires an OWNER or ADMIN token; there is no storefront equivalent and no supplier login."
  - name: "Purchase Requests"
    description: "From \"low stock\" to \"deal closed\": an AI-drafted email to several suppliers at once, their replies read into price/quantity/delivery, the offers ranked side by side, and the two emails that close the deal. The ranking is arithmetic computed on every read — never stored, never an AI call. Requires an OWNER or ADMIN token."
  - name: "Supplier Mailbox"
    description: "Connecting the owner's own Gmail, so purchase requests are sent as them and supplier replies are read back automatically. A second, separate Google consent — never merge it into the Sign-In button. The whole feature is optional: when it is off or disconnected, requests go out over SMTP and replies are pasted in by hand, which is a supported way to run this rather than a degraded one."
