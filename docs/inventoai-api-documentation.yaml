  /advisor/brief:
    get:
      summary: Get Today's Brief
      deprecated: false
      description: |
        The dashboard panel: the store's most recent brief, insights included.

        ## An empty panel is a state, not an error

        A store whose first brief has not been written yet gets **200 with
        `brief: null`** — render "your first brief arrives tomorrow morning",
        never an error. `isStale: true` means the newest brief is not today's,
        so date it ("from Tuesday") rather than implying it is fresh.

        ## Render the numbers from `payload`, never from `body`

        `title` and `body` are prose — usually written by Gemini, and rewritten
        every time the brief is generated. `payload` is what the platform
        measured: **money in minor units** (`11371` is `113.71 EGP`), ids that
        link somewhere, and never a formatted string. The prose already quotes
        the figures in words; the payload is what you build a chip, a link or a
        chart from.

        The shape of `payload` depends on `kind` — see the schema, where each of
        the seven is spelled out.

        ## Two things worth knowing before you trust a brief

        * **A missing section is normal.** Each signal is collected
          independently and one that fails — an unreachable weather host, an
          exhausted AI quota — costs its own lines and never the brief. There is
          no field that says a section was skipped, because from the reader's
          side "nothing to report about the weather" and "the weather could not
          be fetched" are the same page.
        * **`narratorStatus: "fallback"`** means Gemini did not answer and the
          lines are template prose. Every number is still correct; only the
          phrasing is plainer. It is not an error state and needs no banner.

        Insights arrive sorted — render them in `position` order and do not
        re-sort. A busy store fills all 8 slots with stock and demand, so the
        weather and calendar lines can be crowded out on a given day.
      tags:
        - Advisor
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'The newest brief, or an empty state. Never a 404.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    nullable: true
                    description: 'Null when the store has never had a brief written.'
                    allOf:
                      - type: object
                        description: 'One morning''s advice, with its lines.'
                        properties:
                          id:
                            type: string
                            format: uuid
                          briefDate:
                            type: string
                            format: date
                            description: 'The store''s **local** calendar day, `YYYY-MM-DD`. There is at most one brief per store per day.'
                            example: '2026-08-16'
                          headline:
                            type: string
                            maxLength: 300
                            description: 'The one-sentence summary, and the subject line of the email.'
                          insightCount:
                            type: integer
                            description: 'How many lines were **kept**. Capped at 8 — a brief listing forty things is a spreadsheet. What fell off the bottom arrives tomorrow unless the owner acted.'
                          generatedBy:
                            type: string
                            enum:
                              - schedule
                              - manual
                            description: '`schedule` is the store''s own morning; `manual` is the "run it now" button.'
                          narratorStatus:
                            type: string
                            enum:
                              - ai
                              - fallback
                            description: '`fallback` means Gemini did not answer and the lines are template prose. **Every number is still correct** — only the phrasing is plainer. Not an error state; needs no banner.'
                          emailedAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: 'Null when the brief was not emailed — the owner switched it off, their address is unverified, or it was generated manually.'
                          createdAt:
                            type: string
                            format: date-time
                          insights:
                            type: array
                            description: 'In `position` order, most urgent first. Never longer than 8.'
                            items:
                              type: object
                              description: |
                                One line of the brief: the numbers the platform measured, and the sentence
                                something wrote about them.

                                The split is the point. `payload` is the measurement — **money in minor
                                units**, ids that link somewhere, never a formatted string. `title` and `body`
                                are prose, usually written by Gemini and rewritten on every generation.
                                Render figures from `payload`; use the prose as the prose.
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: 'What PATCH /advisor/insights/{id} takes.'
                                kind:
                                  type: string
                                  enum:
                                    - stockout
                                    - restock
                                    - trending
                                    - slow_mover
                                    - demand_gap
                                    - seasonal_event
                                    - weather
                                  description: |
                                    What the line is about, and therefore the shape of `payload`:

                                    * `stockout` — sold out, and it was selling. `{ productId, productTitle, variantId, variantLabel, unitsSoldRecent, estimatedDailyLoss }`
                                    * `restock` — will run out before a reorder could arrive. `{ productId, productTitle, variantId, variantLabel, stockQuantity, unitsPerDay, daysOfCoverage, recommendedQuantity, leadTimeDays }`
                                    * `trending` — selling materially faster than it was. `{ productId, productTitle, recentUnits, baselineUnits, ratio }`
                                    * `slow_mover` — cash sitting on a shelf. `{ productId, productTitle, stockQuantity, tiedUpAmount, daysSinceLastSale }`
                                    * `demand_gap` — shoppers asked the assistant for something this store does not sell. `{ label, occurrences, exampleQuestion, lastAskedAt }`
                                    * `seasonal_event` — something on the calendar. `{ eventKey, eventName, startsOn, daysUntil, matchedCategoryIds, matchedCategoryNames }`
                                    * `weather` — a forecast worth merchandising against. `{ anomaly, maxTempC, minTempC, precipitationMm, onDate }`
                                severity:
                                  type: string
                                  enum:
                                    - critical
                                    - warning
                                    - info
                                  description: 'The first sort key, and worth colouring on. Only `stockout` is `critical`; `restock` and `demand_gap` are `warning`; the rest are `info`.'
                                title:
                                  type: string
                                  maxLength: 200
                                  description: 'Prose. Plain text — render as text, never through innerHTML.'
                                body:
                                  type: string
                                  description: 'Prose, one or two sentences. Quotes the figures from `payload` in words.'
                                payload:
                                  type: object
                                  description: |
                                    The measurement, shaped by `kind` — see the list above.

                                    Fields that recur across kinds:

                                    * `productId` / `variantId` — link targets. A `variantId` means the advice
                                      is about one shelf, not the whole product.
                                    * `variantLabel` — `"Size: M, Colour: Navy"`, or **null** for a simple
                                      product with no options.
                                    * `estimatedDailyLoss`, `tiedUpAmount` — **minor units**. `11371` is
                                      `113.71 EGP` in the store's currency.
                                    * `ratio` — **null** when nothing sold in the baseline window. Say "with
                                      none sold before" rather than printing a dash.
                                    * `daysSinceLastSale` — **null** when the product has never sold at all.
                                    * `unitsPerDay`, `daysOfCoverage` — rounded to two decimals.
                                  additionalProperties: true
                                  example:
                                    productId: 126a73d1-8b39-4302-a277-cfa27b7a0949
                                    productTitle: Crepe Everyday Abaya
                                    variantId: b03d6771-2912-4dab-a410-3b101e8374d1
                                    variantLabel: 'Size: M, Colour: Navy'
                                    stockQuantity: 3
                                    unitsPerDay: 0.86
                                    daysOfCoverage: 3.5
                                    recommendedQuantity: 18
                                    leadTimeDays: 10
                                status:
                                  type: string
                                  enum:
                                    - new
                                    - acted
                                    - dismissed
                                  description: 'What the owner did. A dismissed line stays visible in today''s brief — grey it out rather than hiding it, or it reappears on a refresh.'
                                statusChangedAt:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: 'Null while `status` is `new`. The clock the seven-day suppression is measured from.'
                                position:
                                  type: integer
                                  description: 'The rank the writer assigned. **Render in this order and do not re-sort** — every insight of a brief is written in one statement, so `createdAt` cannot order them.'
                              required:
                                - id
                                - kind
                                - severity
                                - title
                                - body
                                - payload
                                - status
                                - statusChangedAt
                                - position
                        required:
                          - id
                          - briefDate
                          - headline
                          - insightCount
                          - generatedBy
                          - narratorStatus
                          - emailedAt
                          - createdAt
                          - insights
                  isStale:
                    type: boolean
                    description: 'True when the newest brief is not today''s, in the store''s own timezone. False when there is no brief at all.'
                required:
                  - brief
                  - isStale
              examples:
