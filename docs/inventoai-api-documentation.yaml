  /purchase-requests/{id}:
    get:
      summary: Get Purchase Request
      deprecated: false
      description: |
        The request with its offers — the comparison table the owner picks from.

        ## How to read the table

        `offers` arrives **sorted best-first**. Render it in order; do not
        re-sort. The order is: priced before unpriced, on-time before late, then
        cheapest total, then fastest, then oldest.

        * **`rank: 1` / `isRecommended: true`** is the row to highlight.
        * **`isCheapest` and `isFastest` are flagged separately** and can land on
          rows that are *not* recommended. That is deliberate: when the
          recommendation is a dearer offer, showing "cheapest" on a different row
          answers the owner's obvious question instead of leaving them to wonder
          whether the sort is broken. The usual cause is `isLate`.
        * **`rank: null` means unrankable, not worthless** — nobody has quoted a
          price. A supplier still `awaiting`, and a reply the model could not
          read, both land here and both still render. They sort last.
        * **Every amount is minor units.** `unitAmount: 23500` is `235.00 EGP`;
          `totalAmount: 3525000` is `35,250.00 EGP`. Format on the way out with
          the store's currency; never send a decimal back.

        ## Which rows need a paste box

        `isWatched: false` means nobody is reading that thread automatically —
        the owner is the transport, so keep `POST …/offers/{offerId}/reply`
        reachable on that row. `true` means it should fill in on its own within a
        few minutes. Keep the paste box available either way; it is the fallback
        when a mailbox grant is revoked.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'The request and its ranked offers.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productId: d1b0631f-d0c8-487e-a0b1-58437e8f9d4c
