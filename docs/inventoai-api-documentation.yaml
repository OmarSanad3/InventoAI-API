  /chat/sessions/{id}:
    get:
      summary: Get Chat Transcript
      deprecated: false
      description: 'The whole conversation, oldest first. This is the dashboard''s counterpart to the storefront''s `GET /site/:slug/chat/:sessionId`, and unlike that one it needs no capability id — the store scope **is** the authorisation. It also carries two fields the shopper''s own view deliberately does not: `sources`, the ids the assistant actually built the answer from, and `latencyMs`, how long the customer waited. `resolution`, `sources`, `latencyMs` and `reviewedAt` are `null` on `user` rows — they describe an answer.'
      tags:
        - Chatbot / Insights
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 067e2f09-0171-41a2-8335-d4f7ae4a42f9
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  isSignedIn:
                    type: boolean
                  customerName:
                    type: string
                    nullable: true
                  customerEmail:
                    type: string
                    nullable: true
                  messageCount:
                    type: integer
                  lastMessageAt:
                    type: string
                    format: date-time
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  messages:
                    type: array
                    description: 'Oldest first. Carries two fields the shopper''s own view does not.'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                        text:
                          type: string
                        resolution:
                          type: string
                          nullable: true
                          enum:
                            - answered
                            - unanswered
                            - off_topic
                            - needs_login
                            - error
                          description: 'Null on user rows.'
                        sources:
                          type: object
                          nullable: true
                          description: '**Owner-only.** What the assistant actually built the answer from — the ids, not the text. Null on user rows and on turns that used no tool.'
                          properties:
                            productIds:
                              type: array
                              items:
                                type: string
                            faqIds:
                              type: array
                              items:
                                type: string
                            orderId:
                              type: string
                              nullable: true
                          required:
                            - productIds
                            - faqIds
                            - orderId
                        latencyMs:
                          type: integer
                          nullable: true
                          description: '**Owner-only.** How long the customer waited for this reply.'
                        reviewedAt:
                          type: string
