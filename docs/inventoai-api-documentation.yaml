                description: 'The customer''s view of their own order. `internalNote` is **absent by construction** — the owner''s private note is on the dashboard DTO only, so it can never reach the buyer.'
                properties:
                  id:
                    type: string
                  orderNumber:
                    type: integer
                    description: 'Per store and gapless — this, not the id, is what the customer quotes and what the /me routes address.'
                  status:
                    type: string
                    enum:
                      - pending
                      - confirmed
                      - shipped
                      - delivered
                      - cancelled
                    description: 'Fulfilment. pending → confirmed → shipped → delivered, and cancelled from any of the first three. delivered and cancelled are terminal.'
                  paymentStatus:
                    type: string
                    enum:
                      - unpaid
                      - paid
                      - refunded
                    description: 'Money, tracked independently of fulfilment. A COD order flips to paid on delivery.'
                  paymentMethod:
                    type: string
                    enum:
                      - cod
                    description: 'Cash on delivery only until the payments branch lands; `card` is refused with a 400.'
                  currency:
                    type: string
                    description: 'ISO 4217, from the store. Every amount below is in its minor units.'
                    example: EGP
                  subtotalAmount:
                    type: integer
                  shippingFee:
                    type: integer
                  totalAmount:
                    type: integer
                    description: 'subtotalAmount + shippingFee.'
                  contactName:
                    type: string
                    description: 'Snapshotted at checkout, so the order still renders after the account is deleted.'
                  contactEmail:
                    type: string
                  contactPhone:
                    type: string
                  shippingAddress:
                    type: object
                    properties:
                      line1:
                        type: string
                      line2:
                        type: string
                        nullable: true
                      city:
                        type: string
                      governorate:
                        type: string
                        nullable: true
                      postalCode:
                        type: string
                        nullable: true
                      country:
                        type: string
                        description: 'ISO 3166-1 alpha-2, uppercased on write.'
                        example: EG
                    required:
                      - line1
                      - line2
                      - city
                      - governorate
                      - postalCode
                      - country
                  customerNote:
                    type: string
                    nullable: true
                  cancelledAt:
                    type: string
                    format: date-time
                    nullable: true
                  cancelReason:
                    type: string
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      description: 'A **snapshot**, taken at purchase time — never re-read from the catalog. A product since repriced, renamed or deleted still renders here exactly as it was bought.'
                      properties:
                        id:
                          type: string
                        productId:
                          type: string
                          nullable: true
                          description: 'A link back for reporting. Null once the product row is gone; the snapshot below still renders.'
                        variantId:
                          type: string
                          nullable: true
                        productTitle:
                          type: string
                          description: 'Render this, not the live product''s title.'
                        productSlug:
                          type: string
                          description: 'Lets you link back to the product page even after a rename.'
                        productImageUrl:
                          type: string
                          nullable: true
                        variantOptions:
                          type: object
                          additionalProperties:
                            type: string
                          description: 'Attribute **labels**, not ids — `{ "Size": "M", "Colour": "Black" }`, or `{}` for a simple product. Renaming the value "M" to "Medium" moves every live product and no past order.'
                          example:
                            Size: M
                            Colour: Black
                        sku:
                          type: string
                          nullable: true
                        unitAmount:
                          type: integer
                          description: 'Minor units, at the price actually paid.'
                        quantity:
                          type: integer
                        lineTotalAmount:
                          type: integer
                          description: 'unitAmount × quantity, stored rather than recomputed.'
                      required:
                        - id
                        - productId
                        - variantId
                        - productTitle
                        - productSlug
                        - productImageUrl
                        - variantOptions
                        - sku
                        - unitAmount
                        - quantity
                        - lineTotalAmount
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - orderNumber
                  - status
                  - paymentStatus
                  - paymentMethod
                  - currency
                  - subtotalAmount
                  - shippingFee
                  - totalAmount
                  - contactName
                  - contactEmail
                  - contactPhone
                  - shippingAddress
                  - customerNote
                  - cancelledAt
                  - cancelReason
                  - items
                  - createdAt
                  - updatedAt
              example:
                id: bc85d1cd-dc2a-4a3b-9157-fefd1e5fa316
                orderNumber: 4
                status: cancelled
                paymentStatus: unpaid
                paymentMethod: cod
                currency: EGP
                subtotalAmount: 88800
                shippingFee: 0
                totalAmount: 88800
                customerNote: 'Call before delivery, the doorbell is broken.'
                cancelledAt: '2026-08-15T11:14:07.905Z'
                cancelReason: Ordered the wrong size
                createdAt: '2026-08-15T09:31:14.882Z'
                updatedAt: '2026-08-15T11:14:07.905Z'
          headers: {}
        '400':
          description: 'The order is no longer pending. The message names the state it is in.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: This order is already confirmed — ask the store to cancel it
                error: Bad Request
                statusCode: 400
          headers: {}
        '403':
          description: The token belongs to another store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: This account belongs to another store
                error: Forbidden
                statusCode: 403
          headers: {}
        '404':
          description: No such order number for this customer in this store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Order not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /knowledge/status:
    get:
      summary: Get Knowledge Base Status
      deprecated: false
      description: 'What the chatbot can retrieve from, broken down by source. `stale` is **normal** and means "syncing" — a write marks a document stale and a sweeper re-embeds it within a minute, so a non-zero number here is the system working, not a fault. The number that is a real warning is `vectorSearchAvailable: false`: pgvector is missing, so retrieval has silently degraded to lexical-only and semantic questions ("something light for the summer heat") will stop working. `failed` counts documents that gave up after three embedding attempts.'
      tags:
        - Chatbot / Knowledge Base
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: 'Documents the store has, across every source type.'
                  indexed:
                    type: integer
                    description: 'Documents that have a vector. `total - indexed` have never been embedded.'
                  stale:
                    type: integer
                    description: '**Normal, and means "syncing".** A write marks a document stale and the sweeper re-embeds it within a minute.'
                  failed:
                    type: integer
                    description: 'Gave up after three embedding attempts; the sweeper has stopped retrying them.'
                  lastIndexedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Null for a store that has never been indexed — which is every store that existed before this feature and has had no write since.'
                  vectorSearchAvailable:
                    type: boolean
                    description: '**The one number that is a real warning.** False means pgvector is missing and retrieval has silently degraded to lexical-only, so semantic questions ("something light for the summer heat") stop working while exact-word ones still do.'
                  embeddingModel:
                    type: string
                    example: gemini-embedding-001
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceType:
                          type: string
                          enum:
                            - product
                            - faq
                            - category
                            - store_profile
                        total:
                          type: integer
                        indexed:
                          type: integer
                        stale:
                          type: integer
                        failed:
                          type: integer
                      required:
                        - sourceType
                        - total
                        - indexed
                        - stale
                        - failed
                required:
                  - total
                  - indexed
                  - stale
                  - failed
                  - lastIndexedAt
                  - vectorSearchAvailable
                  - embeddingModel
                  - sources
              example:
                total: 15
                indexed: 15
                stale: 0
                failed: 0
                lastIndexedAt: '2026-08-16T15:24:43.083Z'
                vectorSearchAvailable: true
                embeddingModel: gemini-embedding-001
                sources:
                  - sourceType: product
                    total: 7
                    indexed: 7
                    stale: 0
                    failed: 0
                  - sourceType: faq
                    total: 3
                    indexed: 3
                    stale: 0
                    failed: 0
                  - sourceType: store_profile
                    total: 1
                    indexed: 1
                    stale: 0
                    failed: 0
                  - sourceType: category
                    total: 4
                    indexed: 4
                    stale: 0
                    failed: 0
          headers: {}
        '401':
          description: 'No `Authorization` header, or a token that does not verify — a garbage or expired token is `Invalid or expired access token`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: 'A USER token. This is a dashboard route: OWNER or ADMIN only.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
