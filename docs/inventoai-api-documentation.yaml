              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productTitle: Linen Summer Abaya
                status: cancelled
                offerCount: 2
                receivedCount: 0
                sentAt: '2026-08-17T16:27:29.888Z'
