      summary: Generate Variants
      deprecated: false
      description: |-
        The matrix builder. Name the axes and their values and the server writes the cross product in one transaction.

        Combinations that already exist are skipped, and their prices are left alone - so re-running this after widening an axis fills in only the gaps. 3 sizes x 2 colours produces 6 variants; widening to 5 x 6 later tops it up to 30.

        Every `attributeId` must be a variant axis (isVariantAxis true) and every `valueId` must belong to that attribute. Max 3 axes, max 100 resulting variants.
