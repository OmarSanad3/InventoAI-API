  /categories/reorder:
    patch:
      summary: Reorder Categories
      deprecated: false
      description: ''
      tags:
        - Catalog / Categories
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |
                The whole list, in one transaction. **Send every row, not only the ones that
                moved** — ids you omit keep the positions they had, which can leave two rows
                sharing a position (the tie then breaks on `createdAt`, oldest first).

                Nothing is written unless every id is valid and belongs to this store: an
                unknown, duplicated or foreign id rejects the request and leaves all
                positions untouched.
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      position:
                        type: integer
                        minimum: 0
                        description: 'Zero-based. Ascending is the order the list renders in.'
                    required:
                      - id
                      - position
              required:
                - items
            example:
              items:
                - id: 60c5e78a-7cf5-4cc6-9fda-2e50f53ba0ad
                  position: 0
                - id: 30a1112a-3808-4bd7-a415-f4ecc1814de7
                  position: 1
                - id: 3d055016-58cd-4862-bbf7-a7fc381a27cd
                  position: 2
                - id: 45cdf361-25ea-4e90-be9e-07d8f7dca04c
                  position: 3
                - id: cb84f8c5-6b00-47ce-9735-7933e858a24a
                  position: 4
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                description: 'The whole list in the owner''s order — no pagination on reorder responses.'
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    slug:
                      type: string
                      description: 'Unique per store, de-duplicated on create (`summer-sale` → `summer-sale-2`).'
                    description:
                      type: string
                      nullable: true
                    imageUrl:
                      type: string
                      nullable: true
                      description: 'Cloudinary. Replacing an image destroys the old asset; a soft delete leaves it alone.'
                    position:
                      type: integer
                    isPublished:
                      type: boolean
                      description: 'False hides it from the storefront. The dashboard still lists it.'
                    isFeatured:
                      type: boolean
                      description: 'Drives the landing page strip, capped at 6.'
                    productCount:
                      type: integer
                      description: 'Active products only — a draft is not something a shopper can buy.'
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                  required:
                    - id
                    - name
                    - slug
                    - description
                    - imageUrl
                    - position
                    - isPublished
                    - isFeatured
                    - productCount
                    - createdAt
                    - updatedAt
              example:
                - id: 60c5e78a-7cf5-4cc6-9fda-2e50f53ba0ad
                  name: Sale
                  slug: sale
                  description: End of season
                  imageUrl: null
                  position: 0
                  isPublished: false
                  isFeatured: false
                  createdAt: '2026-08-02T10:00:20.389Z'
                  updatedAt: '2026-08-02T10:06:13.730Z'
                - id: 30a1112a-3808-4bd7-a415-f4ecc1814de7
