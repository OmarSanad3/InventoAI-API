  /suppliers:
    post:
      summary: Create Supplier
      deprecated: false
      description: |
        Adds a contact to the store's supplier book. Nothing is emailed here —
        a supplier only ever hears from the store when a purchase request is
        **sent**.

        ## The rules worth knowing

        * **One supplier per email per store.** A duplicate address is a `400`
          naming it. The *same* address in a different store is fine — the
          uniqueness is scoped, like everything else here.
        * **The email is lowercased and the name trimmed** on write, so
          `  Nile Textiles ` and `Sales@Nile.TEST` come back tidy.
        * **A pasted address with a trailing space is accepted.** It is trimmed
          *before* validation, because an address copied out of a mail client
          almost always carries one and `@IsEmail()` would otherwise reject it
          with a 400 the owner cannot see the cause of.
        * **`leadTimeDays` is this supplier's own estimate**, and the minimum is
          `1` — a supplier who delivers in no days at all is a shelf. It is used
          when drafting and is *not* the store-wide figure the Advisor uses.
        * **`notes` is the owner's memory** ("they deliver late"). It is shown in
          the dashboard and is **not** sent to the model or to the supplier.
        * **`storeId` is never accepted.** Sending one is a `400`
          (`property storeId should not exist`); the store comes from the token.

        A store may hold at most **100** suppliers. The 101st is a `400`, and
        deleting one frees the slot again.
      tags:
        - Suppliers
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
