        - name: limit
          in: query
          description: 'Defaults to 20, max 100.'
          required: false
          example: '20'
          schema:
            type: integer
        - name: search
          in: query
          description: 'Matches any message of the conversation, the shopper''s or the assistant''s.'
          required: false
          example: ''
          schema:
            type: string
        - name: from
          in: query
          description: 'Inclusive lower bound on lastMessageAt, ISO 8601. Activity in the window, not creation.'
          required: false
          example: ''
          schema:
            type: string
        - name: to
          in: query
          description: 'Inclusive upper bound on lastMessageAt, ISO 8601.'
          required: false
          example: ''
          schema:
            type: string
        - name: hasUnanswered
          in: query
          description: 'true keeps only conversations with at least one unanswered turn; false keeps only those with none.'
          required: false
