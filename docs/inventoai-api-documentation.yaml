                      - formal
                      - playful
                    description: 'One line appended to the system prompt. An enum rather than a text box on purpose: it is concatenated into a prompt.'
                  contactEmail:
                    type: string
                    nullable: true
                    description: 'Offered by the assistant, in its own words, when it cannot answer.'
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - isEnabled
                  - greeting
                  - effectiveGreeting
                  - tone
                  - contactEmail
                  - updatedAt
