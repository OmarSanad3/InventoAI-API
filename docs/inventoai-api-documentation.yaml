    post:
      summary: Create Product Attribute
      deprecated: false
      description: ''
      tags:
        - Catalog / Product Attributes
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                key:
                  type: string
                isVariantAxis:
                  type: boolean
                isFilterable:
                  type: boolean
                showOnProductPage:
                  type: boolean
                displayStyle:
                  type: string
              required:
                - name
                - key
                - isVariantAxis
                - isFilterable
                - showOnProductPage
                - displayStyle
            example:
              name: Test Attr
              key: test-attr
              isVariantAxis: true
              isFilterable: true
              showOnProductPage: true
              displayStyle: swatch
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    description: 'The owner''s label — "Colour", "اللون". Render this.'
                  key:
                    type: string
                    description: 'The stable identifier the facet grammar uses. Derived from the name on create and unique per store.'
                    example: color
                  isVariantAxis:
                    type: boolean
                    description: '**Immutable after creation.** True means the shopper picks one before adding to cart and it drives SKU, price and stock; false means it only describes and filters.'
                  isFilterable:
                    type: boolean
                    description: 'False keeps it off the storefront sidebar. It still appears on the product page''s spec table.'
                  showOnProductPage:
                    type: boolean
                  displayStyle:
                    type: string
                    enum:
                      - swatch
                      - chip
                      - list
                      - dropdown
                    description: |
                      How the sidebar draws it. **Never guess from the attribute''s name** — that
                      breaks on "Colour"/"Couleur"/"اللون".

                      * `swatch` — a filled circle per value, in `swatchHex`. The only style that carries a colour.
                      * `chip` — a neutral circle with the value''s *text* inside (`S`, `XL`).
                      * `list` — a checkbox and label per value.
                      * `dropdown` — a single select, for long lists.
                  position:
                    type: integer
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        value:
                          type: string
                          description: 'The label a shopper reads — "XL", "Burgundy".'
                        slug:
                          type: string
                          description: 'What the facet query uses: ?attributes=color:burgundy'
                        swatchHex:
                          type: string
                          nullable: true
                          description: '**Only ever set when the attribute''s displayStyle is `swatch`.** Leaving `swatch` clears every value''s colour, and the move is one-way.'
                        position:
                          type: integer
                      required:
                        - id
                        - value
                        - slug
                        - swatchHex
                        - position
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - key
                  - isVariantAxis
                  - isFilterable
                  - showOnProductPage
                  - displayStyle
                  - position
                  - values
                  - createdAt
                  - updatedAt
              example:
                id: 97b2a64f-1d35-44e5-8d76-3265762f5363
                name: Test Attr
                key: test-attr
                isVariantAxis: true
                isFilterable: true
                showOnProductPage: true
                displayStyle: swatch
                position: 5
                values: []
                createdAt: '2026-08-02T13:33:02.377Z'
                updatedAt: '2026-08-02T13:33:02.377Z'
          headers: {}
      security: []
