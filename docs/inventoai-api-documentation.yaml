                error: Forbidden
                statusCode: 403
          headers: {}
      security: []
  /site/{slug}/chat/settings:
    get:
      summary: Get Chat Widget Settings
      deprecated: false
      description: '**Call this before rendering the chat widget.** The owner can switch their assistant off from the dashboard, and when they have, `isEnabled` is `false` and `POST /site/:slug/chat` is a plain 404 — so a widget that renders anyway is a button whose every click fails. `greeting` is the first bubble to show and is always a usable sentence: when the owner has not written one it is defaulted in the store''s own name. `tone` and `contactEmail` are deliberately absent — the first is an instruction to the model, and the second is offered by the assistant in its own words. No token.'
