                    products: []
                    faqs: []
                    order: null
                    requiresLogin: false
          headers: {}
        '400':
          description: 'An empty message, one over 1000 characters, a `sessionId` that is not a uuid, or any field no DTO declares — `storeId` included.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
