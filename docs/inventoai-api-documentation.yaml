                  maximum: 365
                  default: 7
                  description: 'How long **this** supplier usually takes. Minimum 1: zero is not a lead time. Distinct from the store-wide figure in `/advisor/settings`, which is what the Advisor still uses to recommend a restock.'
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: 'The owner''s own memory of this supplier. Shown in the dashboard; never sent to the model and never shown to the supplier.'
                isActive:
                  type: boolean
                  default: true
                  description: 'An inactive supplier is hidden from the request picker and cannot be a recipient, but keeps every deal they were part of.'
              required:
                - name
                - contactEmail
            example:
