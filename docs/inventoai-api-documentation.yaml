  /advisor/insights/{id}:
    patch:
      summary: Act On or Dismiss an Insight
      deprecated: false
      description: |
        What the owner did about one line.

        Both statuses **suppress that advice for seven days**. The signal is
        still there tomorrow — the stock is still low — and the owner has
        already said "I know", so repeating it is how a brief loses its reader.

        * `acted` — "I ordered more." Kept, so a later brief can say how long ago.
        * `dismissed` — "I know." Same suppression, different meaning.

        **`new` is not accepted**: there is no undo, and an owner who changes
        their mind waits for the week to pass. Sending it is a 400.

        One consequence worth building for: a line dismissed today stays visible
        in **today's** brief carrying `status: "dismissed"` — grey it out rather
        than removing it, or the row will reappear on a refresh. It is gone from
        tomorrow's.

        Dismissing a `demand_gap` does **not** mark the underlying chat messages
        reviewed. "I have dealt with this question" and "stop telling me about
        it in the morning" are two different statements, and the chat feed has
        its own review route.
      tags:
        - Advisor
      parameters:
        - name: id
          in: path
          description: 'The insight id, not the brief id.'
          required: true
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - acted
                    - dismissed
                  description: '`new` is deliberately rejected.'
              required:
                - status
            example:
              status: dismissed
        required: true
      responses:
        '200':
          description: 'The updated line. `statusChangedAt` is the clock the seven-day suppression is measured from, so re-dismissing an old line restarts it.'
          content:
            application/json:
              schema:
                type: object
                description: |
                  One line of the brief: the numbers the platform measured, and the sentence
                  something wrote about them.

                  The split is the point. `payload` is the measurement — **money in minor
                  units**, ids that link somewhere, never a formatted string. `title` and `body`
                  are prose, usually written by Gemini and rewritten on every generation.
                  Render figures from `payload`; use the prose as the prose.
                properties:
                  id:
                    type: string
                    format: uuid
                    description: 'What PATCH /advisor/insights/{id} takes.'
                  kind:
                    type: string
                    enum:
                      - stockout
                      - restock
                      - trending
                      - slow_mover
                      - demand_gap
                      - seasonal_event
                      - weather
                    description: |
                      What the line is about, and therefore the shape of `payload`:

                      * `stockout` — sold out, and it was selling. `{ productId, productTitle, variantId, variantLabel, unitsSoldRecent, estimatedDailyLoss }`
                      * `restock` — will run out before a reorder could arrive. `{ productId, productTitle, variantId, variantLabel, stockQuantity, unitsPerDay, daysOfCoverage, recommendedQuantity, leadTimeDays }`
                      * `trending` — selling materially faster than it was. `{ productId, productTitle, recentUnits, baselineUnits, ratio }`
                      * `slow_mover` — cash sitting on a shelf. `{ productId, productTitle, stockQuantity, tiedUpAmount, daysSinceLastSale }`
                      * `demand_gap` — shoppers asked the assistant for something this store does not sell. `{ label, occurrences, exampleQuestion, lastAskedAt }`
                      * `seasonal_event` — something on the calendar. `{ eventKey, eventName, startsOn, daysUntil, matchedCategoryIds, matchedCategoryNames }`
                      * `weather` — a forecast worth merchandising against. `{ anomaly, maxTempC, minTempC, precipitationMm, onDate }`
                  severity:
                    type: string
                    enum:
                      - critical
                      - warning
                      - info
                    description: 'The first sort key, and worth colouring on. Only `stockout` is `critical`; `restock` and `demand_gap` are `warning`; the rest are `info`.'
                  title:
                    type: string
                    maxLength: 200
                    description: 'Prose. Plain text — render as text, never through innerHTML.'
                  body:
                    type: string
                    description: 'Prose, one or two sentences. Quotes the figures from `payload` in words.'
                  payload:
                    type: object
                    description: |
                      The measurement, shaped by `kind` — see the list above.

                      Fields that recur across kinds:

                      * `productId` / `variantId` — link targets. A `variantId` means the advice
                        is about one shelf, not the whole product.
                      * `variantLabel` — `"Size: M, Colour: Navy"`, or **null** for a simple
                        product with no options.
                      * `estimatedDailyLoss`, `tiedUpAmount` — **minor units**. `11371` is
                        `113.71 EGP` in the store's currency.
                      * `ratio` — **null** when nothing sold in the baseline window. Say "with
                        none sold before" rather than printing a dash.
                      * `daysSinceLastSale` — **null** when the product has never sold at all.
                      * `unitsPerDay`, `daysOfCoverage` — rounded to two decimals.
                    additionalProperties: true
                    example:
                      productId: 126a73d1-8b39-4302-a277-cfa27b7a0949
                      productTitle: Crepe Everyday Abaya
                      variantId: b03d6771-2912-4dab-a410-3b101e8374d1
                      variantLabel: 'Size: M, Colour: Navy'
                      stockQuantity: 3
                      unitsPerDay: 0.86
                      daysOfCoverage: 3.5
                      recommendedQuantity: 18
                      leadTimeDays: 10
                  status:
                    type: string
                    enum:
                      - new
                      - acted
                      - dismissed
                    description: 'What the owner did. A dismissed line stays visible in today''s brief — grey it out rather than hiding it, or it reappears on a refresh.'
                  statusChangedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Null while `status` is `new`. The clock the seven-day suppression is measured from.'
                  position:
                    type: integer
                    description: 'The rank the writer assigned. **Render in this order and do not re-sort** — every insight of a brief is written in one statement, so `createdAt` cannot order them.'
                required:
                  - id
                  - kind
                  - severity
                  - title
                  - body
                  - payload
                  - status
                  - statusChangedAt
                  - position
              example:
                id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                kind: stockout
                severity: critical
                title: Chiffon Hijab in Sand is out of stock
                body: 'We have sold 4 units recently, and this stockout is costing us an estimated 113.71 EGP per day.'
                payload:
                  productId: 7bc86c67-52f8-44b3-b8d3-40a7d9c3c500
                  productTitle: Chiffon Hijab
                  variantId: 25279141-24bd-42b4-9beb-0d9d5d1a35e2
                  variantLabel: 'Colour: Sand'
                  unitsSoldRecent: 4
                  estimatedDailyLoss: 11371
                status: dismissed
                statusChangedAt: '2026-08-16T09:12:44.010Z'
                position: 0
          headers: {}
        '400':
          description: 'The id is not a uuid, `status` is `new` or anything outside the enum, or a field no DTO declares.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message:
                  - 'status must be one of: acted, dismissed'
                error: Bad Request
                statusCode: 400
          headers: {}
        '401':
          description: 'No `Authorization` header, or a token that does not verify.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: A USER token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
        '404':
          description: 'No such insight in this store — including another store''s insight id, which 404s rather than 403ing.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Insight not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
