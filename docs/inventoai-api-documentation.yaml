    patch:
      summary: Update Purchase Request (draft only)
      deprecated: false
      description: |
        Edits the drafted email, the quantity, the deadline, or who receives it.

        ## Only while it is a draft

        Once the request is `sent`, this is a **409**. The suppliers have already
        read the old text, and a request whose body changed under them is a
        request whose offers answer a different question. `replied`, `confirmed`
        and `cancelled` are 409 for the same reason.

        Disable the edit affordance whenever `status !== "draft"`.

        ## Replacing the recipients

        Sending `supplierIds` replaces the list wholesale — the old `awaiting`
        offers are deleted and new ones created, so **offer ids change**. Nothing
        has been emailed yet, so nobody is disturbed. Every id must still be an
        active supplier of this store.

        `variantId` is deliberately **not** editable: the snapshot was taken when
        the request was created, and changing the shelf under a drafted email is a
        new request rather than an edit.

        `neededWithinDays` and `note` accept an explicit `null` to clear.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  minLength: 5
                  maxLength: 200
                  description: 'Trimmed on write.'
                body:
                  type: string
                  minLength: 20
                  maxLength: 4000
                  description: 'Plain text, trimmed on write. It should greet nobody — the per-supplier greeting is added by the mail template.'
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100000
                neededWithinDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
                  description: 'Send `null` to remove the deadline.'
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: 'Send `null` to clear.'
                supplierIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: 'Replaces the recipient list wholesale. **Offer ids change.**'
            example:
              subject: 'Quote request — Linen Summer Abaya (18 units)'
              body: |-
                Hello,

                We would like to order 18 units of the Linen Summer Abaya (Size: M, Colour: Navy).

                Could you confirm your unit price, availability for 18 units, and your delivery time?

                Thank you,
                Layali Abayas
              neededWithinDays: 14
        required: true
      responses:
        '200':
          description: 'The request after the edit, offers included.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
          headers: {}
        '400':
          description: 'A bound broken, a foreign or inactive supplier, or `storeId` in the body.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message:
                  - subject must be longer than or equal to 5 characters
                error: Bad Request
                statusCode: 400
          headers: {}
        '409':
          description: 'The request is no longer a draft. **Hide the edit control once `status !== "draft"`.**'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: 'A purchase request can only be edited while it is a draft; this one is sent'
                error: Conflict
                statusCode: 409
          headers: {}
        '404':
          description: 'Unknown id, or another store''s request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Purchase request not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /purchase-requests/{id}/send:
    post:
      summary: Send Purchase Request
      deprecated: false
      description: |
        Emails the drafted request to the recipients who have **never been
        emailed**, and only them. No body.

        ## It is safe to press twice

        Each offer carries its own `sentAt`. Send mails only the ones where it is
        null, so pressing again retries exactly the suppliers a failed send left
        behind and bothers nobody who already has the email.

        Once **every** recipient has been mailed, a further press is a **400**
        rather than a silent no-op — it is the only way the owner learns the
        button did nothing.

        ## What it does to the row

        * The request becomes `sent` and gains a `sentAt`.
        * Every mailed offer gains a `sentAt`.
        * A request that reached **nobody** stays a `draft` and answers **503**,
          so the owner can fix an address and try again.
        * One bad address does not cost the other suppliers their email.

        ## Which mailbox it leaves from

        If the owner has connected their Gmail (see **Supplier Mailbox**), the
        message is sent **as them** — so the supplier's reply lands in their inbox
        and is read back automatically, and those offers come back
        `isWatched: true`. Otherwise it goes over SMTP with `Reply-To` set to the
        owner, and the reply has to be pasted in. Both are supported; the only
        difference is who does the typing.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'Sent. The request is now `sent` and every mailed offer has a `sentAt`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productTitle: Linen Summer Abaya
                variantLabel: 'Size: M, Colour: Navy'
                quantity: 18
                status: sent
                draftStatus: ai
                offerCount: 2
                receivedCount: 0
                sentAt: '2026-08-17T16:27:29.888Z'
                confirmedAt: null
                confirmedOfferId: null
                offers:
                  - id: 4a1c9f77-2b0e-4c6a-9f10-6d2b7c8e5a31
                    supplierName: Cairo Fabric House
                    supplierEmail: orders@cairofabric.test
                    status: awaiting
                    unitAmount: null
                    sentAt: '2026-08-17T16:27:29.875Z'
                    rank: null
                    isRecommended: false
                    isWatched: true
                  - id: 7f5b3d20-8c14-4e93-b6a7-1c0d9e4f2b88
                    supplierName: Nile Textiles
                    supplierEmail: sales@niletextiles.test
                    status: awaiting
                    unitAmount: null
                    sentAt: '2026-08-17T16:27:29.875Z'
                    rank: null
                    isRecommended: false
                    isWatched: true
          headers: {}
        '400':
          description: 'Everyone has already been emailed, or the request is `confirmed`/`cancelled`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Every supplier on this request has already been emailed
                error: Bad Request
                statusCode: 400
          headers: {}
        '503':
          description: 'No supplier could be emailed at all. The request stays a **draft** — fix the address and press again.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: 'The request could not be emailed to any supplier, please try again'
                error: Service Unavailable
                statusCode: 503
          headers: {}
        '404':
          description: 'Unknown id, or another store''s request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
              example:
                message: Purchase request not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /purchase-requests/{id}/cancel:
    post:
      summary: Cancel Purchase Request
      deprecated: false
      description: |
        Abandons the request. No body.

        Legal from `draft`, `sent` and `replied`. **`confirmed` and `cancelled`
        are terminal** — a deal that was struck is not un-struck by a status
        write, and a cancelled request is reopened by creating another one.

        Nothing is emailed: suppliers who were asked are not told the request was
        dropped. Requests are never deleted, only cancelled — it is a record of
        money the store was about to spend.
      tags:
        - Purchase Requests
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 58307a6f-de40-47df-b86e-3531f1d3b131
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: 'Cancelled.'
          content:
            application/json:
              schema:
