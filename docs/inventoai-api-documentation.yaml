      summary: List Briefs
      deprecated: false
      description: 'The brief history, newest first. Rows carry the headline and the counts but **not** the insights — fetch one by id for those. `from` and `to` are matched against `briefDate`, which is a calendar day in the store''s own timezone, so "the first week of Ramadan" means what the owner means by it.'
      tags:
        - Advisor
      parameters:
        - name: page
          in: query
          description: Defaults to 1.
          required: false
          example: '1'
          schema:
            type: integer
        - name: limit
          in: query
          description: 'Defaults to 20, max 100.'
          required: false
          example: '20'
          schema:
            type: integer
        - name: from
          in: query
          description: 'Inclusive lower bound on briefDate. A date or an ISO 8601 timestamp; only the calendar day is used.'
          required: false
          example: '2026-08-01'
          schema:
            type: string
        - name: to
          in: query
          description: 'Inclusive upper bound on briefDate.'
          required: false
          example: '2026-08-31'
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: 'A row of the history list. Deliberately carries no `insights` — fetch one by id for those.'
                      properties:
                        id:
                          type: string
                          format: uuid
                        briefDate:
                          type: string
                          format: date
                          description: 'The store''s **local** calendar day, `YYYY-MM-DD`. There is at most one brief per store per day.'
                          example: '2026-08-16'
                        headline:
                          type: string
                          maxLength: 300
                          description: 'The one-sentence summary, and the subject line of the email.'
                        insightCount:
                          type: integer
                          description: 'How many lines were **kept**. Capped at 8 — a brief listing forty things is a spreadsheet. What fell off the bottom arrives tomorrow unless the owner acted.'
                        generatedBy:
                          type: string
                          enum:
                            - schedule
                            - manual
                          description: '`schedule` is the store''s own morning; `manual` is the "run it now" button.'
                        narratorStatus:
                          type: string
                          enum:
                            - ai
                            - fallback
                          description: '`fallback` means Gemini did not answer and the lines are template prose. **Every number is still correct** — only the phrasing is plainer. Not an error state; needs no banner.'
                        emailedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Null when the brief was not emailed — the owner switched it off, their address is unverified, or it was generated manually.'
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - briefDate
                        - headline
                        - insightCount
                        - generatedBy
                        - narratorStatus
                        - emailedAt
                        - createdAt
                  total:
                    type: integer
                    description: 'Rows matching the filter, across every page.'
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
                required:
                  - items
                  - total
                  - page
                  - limit
                  - totalPages
              example:
                items:
                  - id: 3f1c7d90-6b2a-4e58-9c31-7a5d0e8b4f22
                    briefDate: '2026-08-16'
                    headline: 'Here is your daily update on stock levels, customer requests, and trending items at Layali Abayas.'
                    insightCount: 8
                    generatedBy: schedule
                    narratorStatus: ai
                    emailedAt: '2026-08-16T04:00:12.441Z'
                    createdAt: '2026-08-16T04:00:09.882Z'
                  - id: 2e0b6c8f-5a19-4d47-8b20-6944fd7a3e11
                    briefDate: '2026-08-15'
                    headline: '3 things worth a look today — 1 needs stock.'
                    insightCount: 3
                    generatedBy: manual
                    narratorStatus: fallback
                    emailedAt: null
                    createdAt: '2026-08-15T11:22:41.004Z'
                total: 2
                page: 1
                limit: 20
                totalPages: 1
          headers: {}
        '400':
          description: 'A malformed date, or a query parameter no DTO declares.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message:
                  - from must be a Date instance
                error: Bad Request
                statusCode: 400
          headers: {}
        '401':
          description: 'No `Authorization` header, or a token that does not verify.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: A USER token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
      security: []
  /advisor/briefs/{id}:
    get:
      summary: Get Brief
      deprecated: false
      description: 'One brief with its insights, in `position` order. Another store''s brief id **404s rather than 403ing** — a 403 would confirm the id exists.'
      tags:
        - Advisor
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 3f1c7d90-6b2a-4e58-9c31-7a5d0e8b4f22
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                description: 'One morning''s advice, with its lines.'
                properties:
                  id:
                    type: string
                    format: uuid
                  briefDate:
                    type: string
                    format: date
                    description: 'The store''s **local** calendar day, `YYYY-MM-DD`. There is at most one brief per store per day.'
                    example: '2026-08-16'
                  headline:
                    type: string
                    maxLength: 300
                    description: 'The one-sentence summary, and the subject line of the email.'
                  insightCount:
                    type: integer
                    description: 'How many lines were **kept**. Capped at 8 — a brief listing forty things is a spreadsheet. What fell off the bottom arrives tomorrow unless the owner acted.'
                  generatedBy:
                    type: string
                    enum:
                      - schedule
                      - manual
                    description: '`schedule` is the store''s own morning; `manual` is the "run it now" button.'
                  narratorStatus:
                    type: string
                    enum:
                      - ai
                      - fallback
                    description: '`fallback` means Gemini did not answer and the lines are template prose. **Every number is still correct** — only the phrasing is plainer. Not an error state; needs no banner.'
                  emailedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Null when the brief was not emailed — the owner switched it off, their address is unverified, or it was generated manually.'
                  createdAt:
                    type: string
                    format: date-time
                  insights:
                    type: array
                    description: 'In `position` order, most urgent first. Never longer than 8.'
                    items:
                      type: object
                      description: |
                        One line of the brief: the numbers the platform measured, and the sentence
                        something wrote about them.

                        The split is the point. `payload` is the measurement — **money in minor
                        units**, ids that link somewhere, never a formatted string. `title` and `body`
                        are prose, usually written by Gemini and rewritten on every generation.
                        Render figures from `payload`; use the prose as the prose.
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: 'What PATCH /advisor/insights/{id} takes.'
                        kind:
                          type: string
                          enum:
                            - stockout
                            - restock
                            - trending
                            - slow_mover
                            - demand_gap
                            - seasonal_event
                            - weather
                          description: |
                            What the line is about, and therefore the shape of `payload`:

                            * `stockout` — sold out, and it was selling. `{ productId, productTitle, variantId, variantLabel, unitsSoldRecent, estimatedDailyLoss }`
                            * `restock` — will run out before a reorder could arrive. `{ productId, productTitle, variantId, variantLabel, stockQuantity, unitsPerDay, daysOfCoverage, recommendedQuantity, leadTimeDays }`
                            * `trending` — selling materially faster than it was. `{ productId, productTitle, recentUnits, baselineUnits, ratio }`
                            * `slow_mover` — cash sitting on a shelf. `{ productId, productTitle, stockQuantity, tiedUpAmount, daysSinceLastSale }`
                            * `demand_gap` — shoppers asked the assistant for something this store does not sell. `{ label, occurrences, exampleQuestion, lastAskedAt }`
                            * `seasonal_event` — something on the calendar. `{ eventKey, eventName, startsOn, daysUntil, matchedCategoryIds, matchedCategoryNames }`
                            * `weather` — a forecast worth merchandising against. `{ anomaly, maxTempC, minTempC, precipitationMm, onDate }`
                        severity:
                          type: string
                          enum:
                            - critical
                            - warning
                            - info
                          description: 'The first sort key, and worth colouring on. Only `stockout` is `critical`; `restock` and `demand_gap` are `warning`; the rest are `info`.'
                        title:
                          type: string
                          maxLength: 200
                          description: 'Prose. Plain text — render as text, never through innerHTML.'
                        body:
                          type: string
                          description: 'Prose, one or two sentences. Quotes the figures from `payload` in words.'
                        payload:
                          type: object
                          description: |
                            The measurement, shaped by `kind` — see the list above.

                            Fields that recur across kinds:

                            * `productId` / `variantId` — link targets. A `variantId` means the advice
                              is about one shelf, not the whole product.
                            * `variantLabel` — `"Size: M, Colour: Navy"`, or **null** for a simple
                              product with no options.
                            * `estimatedDailyLoss`, `tiedUpAmount` — **minor units**. `11371` is
                              `113.71 EGP` in the store's currency.
                            * `ratio` — **null** when nothing sold in the baseline window. Say "with
                              none sold before" rather than printing a dash.
                            * `daysSinceLastSale` — **null** when the product has never sold at all.
                            * `unitsPerDay`, `daysOfCoverage` — rounded to two decimals.
                          additionalProperties: true
                          example:
                            productId: 126a73d1-8b39-4302-a277-cfa27b7a0949
                            productTitle: Crepe Everyday Abaya
                            variantId: b03d6771-2912-4dab-a410-3b101e8374d1
                            variantLabel: 'Size: M, Colour: Navy'
                            stockQuantity: 3
                            unitsPerDay: 0.86
                            daysOfCoverage: 3.5
                            recommendedQuantity: 18
                            leadTimeDays: 10
                        status:
                          type: string
                          enum:
                            - new
                            - acted
                            - dismissed
                          description: 'What the owner did. A dismissed line stays visible in today''s brief — grey it out rather than hiding it, or it reappears on a refresh.'
                        statusChangedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Null while `status` is `new`. The clock the seven-day suppression is measured from.'
                        position:
                          type: integer
                          description: 'The rank the writer assigned. **Render in this order and do not re-sort** — every insight of a brief is written in one statement, so `createdAt` cannot order them.'
                      required:
                        - id
                        - kind
                        - severity
                        - title
                        - body
                        - payload
                        - status
                        - statusChangedAt
                        - position
                required:
                  - id
                  - briefDate
                  - headline
                  - insightCount
                  - generatedBy
                  - narratorStatus
                  - emailedAt
                  - createdAt
                  - insights
              example:
                id: 3f1c7d90-6b2a-4e58-9c31-7a5d0e8b4f22
                briefDate: '2026-08-16'
                headline: 'Here is your daily update on stock levels, customer requests, and trending items at Layali Abayas.'
                insightCount: 2
                generatedBy: schedule
                narratorStatus: ai
                emailedAt: '2026-08-16T04:00:12.441Z'
                createdAt: '2026-08-16T04:00:09.882Z'
                insights:
                  - id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    kind: stockout
                    severity: critical
                    title: Chiffon Hijab in Sand is out of stock
                    body: 'We have sold 4 units recently, and this stockout is costing us an estimated 113.71 EGP per day.'
                    payload:
                      productId: 7bc86c67-52f8-44b3-b8d3-40a7d9c3c500
                      productTitle: Chiffon Hijab
                      variantId: 25279141-24bd-42b4-9beb-0d9d5d1a35e2
                      variantLabel: 'Colour: Sand'
                      unitsSoldRecent: 4
                      estimatedDailyLoss: 11371
                    status: new
                    statusChangedAt: null
                    position: 0
                  - id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                    kind: demand_gap
                    severity: warning
                    title: 3 shoppers asked for "leather handbag"
                    body: 'Your assistant could not answer them. You do not stock it yet.'
                    payload:
                      label: leather handbag
                      occurrences: 3
                      exampleQuestion: do you have a leather handbag
                      lastAskedAt: '2026-08-13T16:24:44.218Z'
                    status: new
                    statusChangedAt: null
                    position: 1
          headers: {}
        '400':
          description: The id is not a uuid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: 'Validation failed (uuid is expected)'
                error: Bad Request
                statusCode: 400
          headers: {}
        '401':
          description: 'No `Authorization` header, or a token that does not verify.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: A USER token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: You do not have permission to perform this action
                error: Forbidden
                statusCode: 403
          headers: {}
        '404':
          description: 'No such brief in this store — including another store''s brief id.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Brief not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
  /advisor/generate:
    post:
      summary: Generate Brief Now
      deprecated: false
      description: |
        The "run it now" button. It **replaces today's brief** rather than
        adding one, writes `generatedBy: manual`, and sends no email — the owner
        is already looking at the screen it appears on.

        **Statuses survive a regeneration.** A line the owner dismissed at 09:00
        is still dismissed at 11:00: the writer matches the new signals against
        the old rows by a stable key derived from the *thing* the advice is
        about, never from its wording.

        It runs even when `isEnabled` is false. That switch turns off the
        **schedule**, and an owner who pressed the button has asked.

        Takes no body. Returns the same envelope as `GET /advisor/brief`, so the
        panel can swap its state from one call. `brief` is **null** when the
        collectors found nothing worth saying — that is a 200 and an empty
        panel, not an error: a store with nothing wrong is not a failure to
        generate.

        Behind a **5-minute per-store cooldown**, because it costs a Gemini
        call. A generation that fails clears the cooldown, so an owner who got
        nothing does not have to wait.
      tags:
        - Advisor
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      responses:
