  /site/{slug}/chat:
    post:
      summary: Send Chat Message
      deprecated: false
      description: |
        One turn with the store's assistant. **No login required**, and that is
        the point — a chatbot that demands an account is a chatbot nobody uses.

        ## What to render

        A reply is a **message and a payload**. The bubble is `message.text`;
        everything else you draw comes from the arrays beside it, which are
        rebuilt server-side from live rows *after* the model has spoken. The
        sentence is the one place a number can be wrong, so **never parse a
        price, a stock level or an order total out of `message.text`**.

        Switch on `resolution` — it is computed in code from what the tools
        actually returned, never claimed by the model:

        | `resolution` | What is populated | What to draw |
        | --- | --- | --- |
        | `answered` | `products` | The bubble, then product cards |
        | `answered` | `faqs` | The bubble (it already contains the answer), then "From our FAQ" links |
        | `answered` | `order` | The bubble, then one order row linking to its detail page |
        | `unanswered` | nothing | The bubble alone |
        | `off_topic` | nothing | The bubble alone |
        | `needs_login` | nothing, `requiresLogin: true` | The bubble, then a sign-in button |
        | `error` | nothing | The bubble, then a retry affordance |

        Three shapes are worth reading the schema for, because they are not what
        you would guess:

        * **`products`** is the *same* card DTO `GET /site/{slug}/products`
          returns — so reuse the listing's card component verbatim. Prices are
          **minor units**; `minPriceAmount === maxPriceAmount` means one price,
          otherwise render "from …". A card has a `slug`, not an id.
        * **`faqs` carries `id` and `question` only — there is no `answer`.** It
          is a *citation*: the assistant has already written the answer into
          `message.text`. Render the questions as links. To show the answer
          inline, match on the **question string** against
          `GET /site/{slug}/faqs` — that route is public and cacheable but
          returns `{ question, answer }` with no id, so the id here is a key,
          not a lookup handle.
        * **`order` is a summary, not a full order.** It has `itemCount` and no
          line items. To show what was bought, link to
          `/site/{slug}/orders/me/{orderNumber}` — the order number, not the id,
          is what that route takes.

        ## The session contract

        Omit `sessionId` on the first message; the reply carries the one the
        server issued. Send it back on every message after that, and keep it
        (localStorage) so a reload can resume the conversation through the
        transcript route. An unknown id is a **404, never a silent new
        session** — if you get one, start a fresh conversation rather than
        retrying.

        ## Auth is optional but not ignored

        Send the customer's bearer token when you have one and the assistant can
        look up *their* orders; send none and it answers everything else. An
        expired token is a **401 rather than a quiet downgrade to anonymous**,
        so refresh and retry rather than dropping the header. A token issued for
        another store is a 403.

        ## What it will never do

        The assistant never writes: it does not place, cancel or change an
        order, and it does not add to a cart. It answers, and it links to the
        page where the customer does it themselves. There is also **no
        streaming** — the reply arrives whole, after a few seconds. Render a
        typing indicator meanwhile.
      tags:
        - Storefront / Chat
      parameters:
        - name: slug
          in: path
          description: ''
          required: true
          example: layali
          schema:
            type: string
        - name: Authorization
          in: header
          description: 'Optional. Send the customer''s token to unlock the order tools; omit it entirely for an anonymous shopper.'
          required: false
          example: Bearer {{access_token}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: '1–1000 characters.'
                sessionId:
                  type: string
                  description: 'Omit on the first message; echo the server''s back afterwards.'
              required:
                - message
            example:
              message: I need something light to wear in the summer heat
        required: true
      responses:
        '200':
          description: '200, not 201: a message is not a resource you address afterwards, and the session id it may have created is in the body.'
          content:
            application/json:
              schema:
                type: object
                description: |
                  A reply is a **message and a payload**.

                  Render the payload; never parse a number out of `message.text`. The cards,
                  citations and order below are rebuilt server-side from live rows after the
                  model has spoken, while the sentence is what the model wrote — and the
                  sentence is the one place a price can be wrong.

                  Which array is populated follows from `resolution`: an `answered` product
                  question fills `products`, an `answered` policy question fills `faqs`, an
                  `answered` order question fills `order`, and `unanswered` / `off_topic` fill
                  none of them.
                properties:
                  sessionId:
                    type: string
                    format: uuid
                    description: 'The conversation. On the first message the server issues it — **store it** (localStorage) and send it back on every message after that.'
                  message:
                    type: object
                    description: 'The assistant''s bubble.'
                    properties:
                      id:
                        type: string
                        format: uuid
                      text:
                        type: string
                        description: 'Plain text, in the shopper''s own language. Render with `white-space: pre-line`; it is never HTML and must never go through innerHTML.'
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - text
                      - createdAt
                  resolution:
                    type: string
                    enum:
                      - answered
                      - unanswered
                      - off_topic
                      - needs_login
                      - error
                    description: |
                      What became of the turn, **computed in code from what the tools actually
                      returned** — never reported by the model, because a model asked to assess
                      itself says it was helpful.

                      * `answered` — a tool returned something and the reply was built on it. Expect a populated `products`, `faqs` or `order`.
                      * `unanswered` — on topic, retrieved nothing. The payload is empty. This is the feed the Daily AI Advisor mines for "45 shoppers asked for wireless earbuds".
                      * `off_topic` — not about this store. The payload is empty and the text is a one-line redirect.
                      * `needs_login` — an order question with nobody signed in. `requiresLogin` is true; show the sign-in button.
                      * `error` — the model or a tool failed and the shopper got the fallback sentence. Offer a retry.
                  products:
                    type: array
                    description: 'Product cards, at most 4. Empty unless the shopper asked about products and something matched.'
                    items:
                      type: object
                      description: 'The **same** card DTO `GET /site/{slug}/products` returns — a card in a chat bubble and a card on the listing page are the same object, so render it with the same component.'
                      properties:
                        title:
                          type: string
                        slug:
                          type: string
                          description: 'The only identifier here. Link to /{storeSlug}/products/{slug}; there is no product id on a card.'
                        shortDescription:
                          type: string
                          nullable: true
                        imageUrl:
                          type: string
                          nullable: true
                          description: 'The primary image, or null — render a placeholder rather than assuming one exists.'
                        imageAltText:
                          type: string
                          nullable: true
                        categories:
                          type: array
                          description: 'Published categories only.'
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              slug:
                                type: string
                                description: 'Link target: /{storeSlug}/products?category={slug}'
                              description:
                                type: string
                                nullable: true
                              imageUrl:
                                type: string
                                nullable: true
                              productCount:
                                type: integer
                                nullable: true
                                description: '**null on a product card**, and that is deliberate — the chips on a card are not counted, and a 0 would read as "this category is empty".'
                            required:
                              - name
                              - slug
                              - description
                              - imageUrl
                              - productCount
                        minPriceAmount:
                          type: integer
                          description: '**Minor units.** 79900 is 799.00 in the store''s currency.'
                        maxPriceAmount:
                          type: integer
                          description: 'Equal to minPriceAmount for a simple product, so render "799.00" when they match and "from 799.00" when they do not — from the numbers alone, not from a flag.'
                        inStock:
                          type: boolean
                          description: 'True when any variant has stock. Exact quantities are never exposed to a shopper.'
                        swatches:
                          type: array
                          description: 'Distinct swatch-styled values across the product''s variants, for the colour dots on the card. Empty when the product has no swatch axis.'
                          items:
                            type: object
                            properties:
                              attributeKey:
                                type: string
                                example: color
                              attributeName:
                                type: string
                                description: 'The owner''s own label — "Colour", "اللون". Render this, never the key.'
                                example: Colour
                              value:
                                type: string
                                example: Sand
                              slug:
                                type: string
                                example: sand
                              swatchHex:
                                type: string
                                nullable: true
                                description: 'Always present here: only swatch-styled values reach this array.'
                                example: '#d9c7a7'
                            required:
                              - attributeKey
                              - attributeName
                              - value
                              - slug
                              - swatchHex
                      required:
                        - title
                        - slug
                        - shortDescription
                        - imageUrl
                        - imageAltText
                        - categories
                        - minPriceAmount
                        - maxPriceAmount
                        - inStock
                        - swatches
                  faqs:
                    type: array
                    description: 'At most 2 citations. **Carries the question only — the answer is in `message.text`.**'
                    items:
                      type: object
                      description: |
                        **A citation, not an FAQ entry — there is no `answer` field here.**

                        The assistant has already written the answer into `message.text`; this array
                        says which entries it drew on, so you can render "From our FAQ: …" links
                        underneath the bubble.

                        **Do not try to resolve `id` against `GET /site/{slug}/faqs`.** That payload
                        is `{ question, answer }` and carries no id, by design. To expand the full
                        answer inline, match on the **`question` string**, which is byte-identical
                        between the two routes. The id here is stable and makes a good React key,
                        but it is not a lookup handle on any public route.
                      properties:
                        id:
                          type: string
                          description: 'Stable, and a good React key. **Not resolvable through any public route** — `GET /site/{slug}/faqs` returns question and answer only. Match on `question` when you need the answer text.'
                        question:
                          type: string
                          description: 'The entry''s question, verbatim. Render it as the link label.'
                      required:
                        - id
                        - question
                  order:
                    nullable: true
                    description: 'The customer''s own order, when they asked about one and were signed in. Null otherwise — including for every anonymous conversation. It is a **summary**: to show the lines, link to `/site/{slug}/orders/me/{orderNumber}`.'
                    allOf:
                      -
                        type: object
                        description: 'One row of an order table — and the shape the chatbot returns in `order`. Lines are summarised into `itemCount` rather than shipped whole; to render the products, follow up with `GET /site/{slug}/orders/me/{orderNumber}`.'
                        properties:
                          id:
                            type: string
                          orderNumber:
                            type: integer
                            description: 'What you address the detail route with, and what the customer quotes.'
                          status:
                            type: string
                            enum:
                              - pending
                              - confirmed
                              - shipped
                              - delivered
                              - cancelled
                            description: 'Fulfilment. pending → confirmed → shipped → delivered, and cancelled from any of the first three. delivered and cancelled are terminal.'
                          paymentStatus:
                            type: string
                            enum:
                              - unpaid
                              - paid
                              - refunded
                          paymentMethod:
                            type: string
                            enum:
                              - cod
                          currency:
                            type: string
                            example: EGP
                          totalAmount:
                            type: integer
                            description: 'Minor units.'
                          itemCount:
                            type: integer
                            description: 'Distinct **lines**, not units — "3 items" means three products, however many of each.'
                          contactName:
                            type: string
                          contactEmail:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - orderNumber
                          - status
                          - paymentStatus
                          - paymentMethod
                          - currency
                          - totalAmount
                          - itemCount
                          - contactName
                          - contactEmail
                          - createdAt
                  requiresLogin:
                    type: boolean
                    description: 'True exactly when `resolution` is `needs_login`. Hang the sign-in button off this rather than off the string.'
                required:
                  - sessionId
                  - message
                  - resolution
                  - products
                  - faqs
                  - order
                  - requiresLogin
              examples:
                productAnswer:
                  summary: 'Product question → cards'
                  description: 'The common case. `products` is populated, `faqs` and `order` are empty. Render the cards from the array and **never** parse a price out of `message.text`.'
                  value:
                    sessionId: 812d0ca7-dfd5-4736-82dc-901bbbc42380
                    message:
                      id: 320ff8db-e6f8-4434-9422-b65f8d05d32b
                      text: 'I recommend our Linen Summer Abaya, which is designed with an open-weave fabric specifically for the hottest weeks. You can take a look at it here, along with our other lightweight options.'
                      createdAt: '2026-08-16T12:28:49.268Z'
                    resolution: answered
                    products:
                      - title: Linen Summer Abaya
                        slug: linen-summer-abaya
                        shortDescription: Open-weave linen for the hottest weeks.
                        imageUrl: 'https://res.cloudinary.com/demo/image/upload/v1/inventoai/linen-abaya.jpg'
                        imageAltText: A sand-coloured linen abaya
                        categories:
                          - name: Abayas
                            slug: abayas
                            description: Everyday and occasion abayas
                            imageUrl: null
                            productCount: null
                        minPriceAmount: 79900
                        maxPriceAmount: 84900
                        inStock: true
                        swatches:
                          - attributeKey: color
                            attributeName: Colour
                            value: Sand
                            slug: sand
                            swatchHex: '#d9c7a7'
                    faqs: []
                    order: null
                    requiresLogin: false
                faqAnswer:
                  summary: 'Policy question → an FAQ citation'
                  description: |
                    The assistant answers the policy question **in `message.text`** and cites
                    the entries it used. Note what `faqs` carries: `id` and `question`, and
                    **no `answer`** — it is a citation, not the FAQ entry. Render it as
                    "From our FAQ: …" underneath the bubble. To show the answer text inline,
                    match on the **question string** against `GET /site/{slug}/faqs`: that
                    route is public and cacheable, but it returns no id, so the id here
                    cannot be used to look the entry up.
                  value:
                    sessionId: 812d0ca7-dfd5-4736-82dc-901bbbc42380
                    message:
                      id: 9c1f1d24-5f2e-4a7e-9b1a-7c2f6a0b31d5
                      text: 'Yes — you can return anything unworn within 14 days of delivery, and we cover the return shipping inside Cairo. Full details are in the policy below.'
                      createdAt: '2026-08-16T12:31:02.114Z'
                    resolution: answered
                    products: []
                    faqs:
                      - id: c882825c-c305-4eb6-bdc9-da214072258d
                        question: What is your return policy?
                      - id: 4f0f2a51-6d0c-4a58-9f0e-3b7c1d5a2e88
                        question: Who pays for return shipping?
                    order: null
                    requiresLogin: false
                orderAnswer:
                  summary: 'Order question, signed in → an order summary'
                  description: |
                    Only ever populated when the caller sent a valid token **and** the order
                    belongs to them. It is the same summary row `GET /site/{slug}/orders/me`
                    returns: `itemCount` counts distinct lines, and there are **no line items
                    here**. To show what was bought, link to
                    `/site/{slug}/orders/me/{orderNumber}`, which returns the full order with
