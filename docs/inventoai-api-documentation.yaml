  /orders/{id}/status:
    patch:
      summary: Update Order Status
      deprecated: false
      description: "Moves the order along the machine:\n\n```\npending ──▶ confirmed ──▶ shipped ──▶ delivered\n   │            │            │\n   └────────────┴────────────┴──▶ cancelled\n```\n\n`delivered` and `cancelled` are final — grey the buttons out rather than letting the call fail. Cancelling from `pending` or `confirmed` **restores the stock** and recomputes the products' aggregates; from `shipped` it does not, because the goods have left. Delivering a `cod` order flips `paymentStatus` to `paid` in the same call — there is no separate mark-as-paid route."
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 5da5c099-7170-47e1-9005-ec9d795fc5e3
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'pending, confirmed, shipped, delivered or cancelled.'
                reason:
                  type: string
                  description: 'Recorded only when the new status is cancelled. Max 200 characters.'
              required:
                - status
            example:
              status: confirmed
        required: true
      responses:
        '200':
          description: 'The whole order, in the same shape as GET /orders/{id}.'
          content:
            application/json:
              schema:
                type: object
                description: 'The dashboard''s view: everything the customer sees, plus the owner-only fields.'
                properties:
                  id:
                    type: string
                  orderNumber:
                    type: integer
                    description: 'Per store and gapless — this, not the id, is what the customer quotes and what the /me routes address.'
                  status:
                    type: string
                    enum:
                      - pending
                      - confirmed
                      - shipped
                      - delivered
                      - cancelled
                    description: 'Fulfilment. pending → confirmed → shipped → delivered, and cancelled from any of the first three. delivered and cancelled are terminal.'
                  paymentStatus:
                    type: string
                    enum:
                      - unpaid
                      - paid
                      - refunded
                    description: 'Money, tracked independently of fulfilment. A COD order flips to paid on delivery.'
                  paymentMethod:
                    type: string
                    enum:
                      - cod
                    description: 'Cash on delivery only until the payments branch lands; `card` is refused with a 400.'
                  currency:
                    type: string
                    description: 'ISO 4217, from the store. Every amount below is in its minor units.'
                    example: EGP
                  subtotalAmount:
                    type: integer
                  shippingFee:
                    type: integer
                  totalAmount:
                    type: integer
                    description: 'subtotalAmount + shippingFee.'
                  contactName:
                    type: string
                    description: 'Snapshotted at checkout, so the order still renders after the account is deleted.'
                  contactEmail:
                    type: string
                  contactPhone:
                    type: string
                  shippingAddress:
                    type: object
                    properties:
                      line1:
                        type: string
                      line2:
                        type: string
                        nullable: true
                      city:
                        type: string
                      governorate:
                        type: string
                        nullable: true
                      postalCode:
                        type: string
                        nullable: true
                      country:
                        type: string
                        description: 'ISO 3166-1 alpha-2, uppercased on write.'
                        example: EG
                    required:
                      - line1
                      - line2
                      - city
                      - governorate
                      - postalCode
                      - country
                  customerNote:
                    type: string
                    nullable: true
                  cancelledAt:
                    type: string
                    format: date-time
                    nullable: true
                  cancelReason:
                    type: string
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      description: 'A **snapshot**, taken at purchase time — never re-read from the catalog. A product since repriced, renamed or deleted still renders here exactly as it was bought.'
                      properties:
                        id:
                          type: string
                        productId:
                          type: string
                          nullable: true
                          description: 'A link back for reporting. Null once the product row is gone; the snapshot below still renders.'
                        variantId:
                          type: string
                          nullable: true
                        productTitle:
                          type: string
                          description: 'Render this, not the live product''s title.'
                        productSlug:
                          type: string
                          description: 'Lets you link back to the product page even after a rename.'
                        productImageUrl:
                          type: string
                          nullable: true
                        variantOptions:
                          type: object
                          additionalProperties:
                            type: string
                          description: 'Attribute **labels**, not ids — `{ "Size": "M", "Colour": "Black" }`, or `{}` for a simple product. Renaming the value "M" to "Medium" moves every live product and no past order.'
                          example:
                            Size: M
                            Colour: Black
                        sku:
                          type: string
                          nullable: true
                        unitAmount:
                          type: integer
                          description: 'Minor units, at the price actually paid.'
                        quantity:
                          type: integer
                        lineTotalAmount:
                          type: integer
                          description: 'unitAmount × quantity, stored rather than recomputed.'
                      required:
                        - id
                        - productId
                        - variantId
                        - productTitle
                        - productSlug
                        - productImageUrl
                        - variantOptions
                        - sku
                        - unitAmount
                        - quantity
                        - lineTotalAmount
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  internalNote:
                    type: string
                    nullable: true
                    description: 'Owner-only. Never present on a /site/:slug route.'
                  userId:
                    type: string
                    nullable: true
                    description: 'Null once the buyer''s account is deleted; the contact snapshot still renders.'
                required:
                  - id
                  - orderNumber
                  - status
                  - paymentStatus
                  - paymentMethod
                  - currency
                  - subtotalAmount
                  - shippingFee
                  - totalAmount
                  - contactName
                  - contactEmail
                  - contactPhone
                  - shippingAddress
                  - customerNote
                  - cancelledAt
                  - cancelReason
                  - items
                  - createdAt
                  - updatedAt
                  - internalNote
                  - userId
              example:
                id: 5da5c099-7170-47e1-9005-ec9d795fc5e3
                orderNumber: 1
                status: confirmed
                paymentStatus: unpaid
                paymentMethod: cod
                currency: EGP
                subtotalAmount: 115700
                shippingFee: 0
                totalAmount: 115700
                cancelledAt: null
                cancelReason: null
                internalNote: null
                createdAt: '2026-08-15T09:31:14.512Z'
                updatedAt: '2026-08-15T09:33:51.004Z'
          headers: {}
        '400':
          description: 'The move is not on the machine. The message names both states, and a terminal state says so — "An order cannot go from delivered to shipped; delivered is final".'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: 'An order cannot go from pending to delivered — allowed next: confirmed, cancelled'
                error: Bad Request
                statusCode: 400
          headers: {}
        '404':
          description: No such order in the caller's store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Order not found
                error: Not Found
                statusCode: 404
          headers: {}
        '409':
          description: 'Someone else changed the order between this call''s read and its write — the write is conditional on the status it read, so a lost race never restores stock twice. Reload rather than retrying blind.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: This order changed while you were working on it — reload it
                error: Conflict
                statusCode: 409
          headers: {}
      security: []
