                  - id: 751747f4-1ea2-43f6-8511-ae48c8dd55b9
                    role: assistant
                    text: Yes — our returns policy covers unworn items, and the details are in the FAQ below.
                    resolution: answered
                    createdAt: '2026-08-15T16:26:44.195Z'
          headers: {}
        '400':
          description: The session id is not a uuid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: 'Validation failed (uuid is expected)'
                error: Bad Request
                statusCode: 400
          headers: {}
        '401':
          description: 'The conversation is bound to a customer and no token was sent (`Sign in to read this conversation`), or a token was sent and does not verify (`Invalid or expired access token`).'
