  /purchase-requests:
    post:
      summary: Create Purchase Request
      deprecated: false
      description: |
        Starts a request: snapshots the shelf being reordered, asks Gemini for a
        covering email, and lists the chosen suppliers as `awaiting` offers.

        ## It sends nothing

        The response is a `draft`. The owner reads the drafted email, edits it if
        they want, and presses send separately. Nothing here reaches a supplier —
        that is the whole reason create and send are two calls.

        ## Where the inputs come from

        `variantId`, not `productId`: stock is per variant, and a request for
        "the abaya" when three sizes are running out separately is a request
        nobody can quote. The Advisor's restock insight already carries
        `variantId` and a recommended quantity in its `payload`, so the
        dashboard's "reorder" button posts them straight here.

        ## What can go wrong

        * An unknown or another store's `variantId` → **404**.
        * A supplier who is **inactive**, deleted, or belongs to another store →
          **400**, and *none* of them are asked. An owner who picked four
          suppliers and had three mailed would never find out which.
        * `quantity: 0`, an empty `supplierIds`, more than 10 recipients,
          duplicate ids, or `storeId` in the body → **400**.

        ## A Gemini outage costs phrasing, not the request

        If the model does not answer, `body` is a complete template email that
        asks the same three questions — unit price, availability for the
        quantity, delivery time — and `draftStatus` is `fallback`. Still sendable,
        still editable. Do not treat it as an error.
      tags:
        - Purchase Requests
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{admin_access_tk}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variantId:
                  type: string
                  format: uuid
                  description: 'The **variant** being reordered — stock lives there, not on the product. Its title and options are snapshotted onto the request.'
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100000
                  description: 'How many units to ask for.'
                supplierIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: 'Who to ask. Every one must be an **active** supplier of this store, or the whole call is a 400. One request, several suppliers — that is the point.'
                neededWithinDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: 'Optional deadline. It is what makes an offer `isLate`, and late offers sort below on-time ones however cheap. Omit it and nothing can be late.'
                note:
                  type: string
                  maxLength: 500
                  description: 'Optional steer for the draft — "ask about bulk pricing at 30 units". Goes to the model; is not itself part of the email.'
              required:
                - variantId
                - quantity
                - supplierIds
            example:
              variantId: 9315d3cd-d66b-4325-b6b4-0fd9e58944ec
              quantity: 18
              supplierIds:
                - 0f35e5e0-ffda-4d42-8b0a-16af0db9719f
                - 8c64fe28-c11f-488d-8d66-8444be98ca8f
              neededWithinDays: 10
              note: Ask whether the price improves at 30 units.
        required: true
      responses:
        '201':
          description: 'A draft, with one `awaiting` offer per recipient. Nothing emailed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestDetail'
              example:
                id: 58307a6f-de40-47df-b86e-3531f1d3b131
                productId: d1b0631f-d0c8-487e-a0b1-58437e8f9d4c
                variantId: 9315d3cd-d66b-4325-b6b4-0fd9e58944ec
                productTitle: Linen Summer Abaya
                variantLabel: 'Size: M, Colour: Navy'
                quantity: 18
                neededWithinDays: 10
                subject: 'Purchase request from Layali Abayas — Linen Summer Abaya'
                body: |-
                  Hello,

                  We are looking to restock the Linen Summer Abaya (Size: M, Colour: Navy) and would like to order 18 units.

                  Could you let us know your unit price, whether you have 18 units available, and how long delivery would take? We would also be glad to hear whether the price improves at 30 units.

