  /site/{slug}/categories:
    get:
      summary: Get Store Categories
      deprecated: false
      description: ''
      tags:
        - Storefront / Site
      parameters:
        - name: slug
          in: path
          description: ''
          required: true
          example: layali
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                description: 'Published categories only, in the owner''s own order. A bare array — there is no pagination here, because the page renders the list whole.'
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    slug:
                      type: string
                      description: 'Link target: /{storeSlug}/products?category={slug}'
                    description:
                      type: string
                      nullable: true
                    imageUrl:
                      type: string
                      nullable: true
                    productCount:
                      type: integer
                      nullable: true
                      description: '**null on a product card**, and that is deliberate — the chips on a card are not counted, and a 0 would read as "this category is empty".'
                  required:
                    - name
                    - slug
                    - description
                    - imageUrl
                    - productCount
              example:
                - name: Abayas
                  slug: abayas
                  description: Everyday and occasion abayas
                  imageUrl: null
                - name: Hijabs & Scarves
                  slug: hijabs-scarves
                  description: Chiffon, jersey and silk
                  imageUrl: null
                - name: Kaftans
                  slug: kaftans
                  description: Relaxed house and hosting wear
                  imageUrl: null
                - name: Accessories
                  slug: accessories
                  description: Pins, caps and underscarves
                  imageUrl: null
          headers: {}
      security: []
