                error: Bad Request
                statusCode: 400
          headers: {}
        '401':
          description: 'No `Authorization` header, or a token that does not verify — a garbage or expired token is `Invalid or expired access token`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Missing or malformed Authorization header
                error: Unauthorized
                statusCode: 401
          headers: {}
        '403':
          description: A USER token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: 'A single sentence, or an array of them when the validation pipe rejected several fields at once.'
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
