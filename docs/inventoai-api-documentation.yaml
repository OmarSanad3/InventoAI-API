  /site/{slug}/filters:
    get:
      summary: Get Store Filters
      deprecated: false
      description: |-
        What the storefront sidebar renders itself from: the price range, the categories and every filterable attribute with live counts.

        It takes the SAME query string as the product listing, and you should pass the filters already applied - otherwise the counts describe a page the shopper is not looking at. Call it alongside every listing call.

        Three behaviours worth relying on:
        - A facet's own selection is excluded from its own counts, while narrowing every other facet. That is what makes a sidebar usable: picking "Black" must not collapse the colour list to one option.
        - `count: 0` is returned, not omitted. Options that vanish feel broken.
        - `displayStyle` and `swatchHex` come straight through, so the sidebar never guesses from a name: swatch = coloured circles, chip = neutral circles with the text inside, list = checkboxes, dropdown = a select.

        Attributes the owner marked unfilterable are omitted entirely.
