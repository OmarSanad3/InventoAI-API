        Every field is optional — patch one switch at a time. The nullable ones
        accept an explicit **null** to clear.

        Four rules the form has to honour:

        * **`latitude` and `longitude` are both or neither.** One without the
          other is a 400, checked against the *merged* row — so setting only the
          latitude of a store that already has a longitude is fine. Unset means
          no weather line **and no outbound request**.
        * **`timezone` decides more than delivery time.** Every window the
          Advisor measures — "the last 7 days", "today" — is that zone's days,
          and the brief is written when `sendHour` strikes there. It is
          validated against the IANA database, so `Africa/Cairo` is accepted and
          `Mars/Olympus` is a 400.
        * **`countryCode`** picks the local calendar events. Ramadan and both
          Eids are included for every store regardless of it.
        * **`leadTimeDays`** is how long the supplier takes, which is what a
