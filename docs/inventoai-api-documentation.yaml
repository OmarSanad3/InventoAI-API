  /site-builder/publish:
    post:
      summary: Publish
      deprecated: false
      description: ''
      tags:
        - Site Builder
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer {{access_token}}
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                themeId:
                  type: string
              required:
                - themeId
            example:
              themeId: 1c7c0610-112d-493c-8c93-17ddfd705a8e
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug:
                    type: string
                    description: 'The SITENAME path segment the storefront renders at.'
                  status:
                    type: string
                    enum:
                      - draft
                      - live
                    description: 'Every storefront route 404s while this is `draft` — that is the correct behaviour, not a bug.'
                  storeUrl:
                    type: string
                    description: 'The absolute URL of the published storefront.'
                required:
                  - slug
                  - status
                  - storeUrl
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: integer
                required:
                  - message
                  - error
                  - statusCode
              example:
                message: Theme not found
                error: Not Found
                statusCode: 404
          headers: {}
      security: []
