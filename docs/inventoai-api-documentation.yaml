  /site/{slug}/products:
    get:
      summary: Get Store Products (Search & Filter)
      deprecated: false
      description: |-
        A live store's active products: filtered, sorted, paginated and searched. No token - this is what the storefront calls.

        SEARCH MODES. Read `searchMode` on the response, never on the request:
        - `null` - no search term was sent, or it was under 2 characters. A plain browse page.
        - `exact` - ranked Postgres full-text. Title matches outrank description matches, "running" finds "Run Faster Socks" through the stemmer, and the last token is prefix-matched so "popco" finds "Popcorn".
        - `fuzzy` - full-text found nothing, so a trigram pass ran. `didYouMean` carries the best title found; render "Showing results for ...".

        A fuzzy page with no items and `didYouMean: null` is the normal empty-results case, not an error:

        ```json
        {
          "items": [],
          "total": 0,
          "page": 1,
          "limit": 20,
          "totalPages": 0,
          "searchMode": "fuzzy",
          "didYouMean": null
        }
        ```

        A typo, `?search=popcorm`, comes back as:

        ```json
        {
          "total": 2,
          "page": 1,
          "limit": 3,
          "totalPages": 1,
          "searchMode": "fuzzy",
          "didYouMean": "Popcorn Kernels 1kg"
        }
        ```

        Search never 400s for being long: over 100 characters it is truncated, and only past 2000 is it rejected. Punctuation is safe - `a & b | !c (d):*` returns 200.

        CUSTOM FACETS. The store's own filters travel in ONE parameter with a small grammar:

            ?attributes=size:xl,l;color:black

        Comma = OR within a facet, semicolon = AND across facets. `?size=xl` CANNOT work: the API rejects any query parameter it does not declare, and it cannot declare a field that is a row in a store's database. That request 400s with "property size should not exist". Unknown keys and unknown values inside `attributes` are ignored instead, so a stale bookmark still renders. Max 10 facets, 20 values each, 500 characters.

        Facets match per PRODUCT, not per variant: a product sold in XL/ivory and S/black matches `size:xl;color:black`. That is what every commerce site does, but do not let the UI promise a variant-level intersection.

        SORTING. `sort` is optional: it defaults to `relevance` when a search is present and `newest` when it is not. Sending `sort=relevance` with no search degrades to `newest` rather than 400 - these URLs get shared, and clearing the search box must not land the shopper on an error page.
      tags:
        - Storefront / Catalog
      parameters:
        - name: slug
          in: path
          description: The store slug, the SITENAME in inventoai.com/SITENAME.
          required: true
          example: layali
          schema:
            type: string
        - name: page
          in: query
          description: ''
          required: false
          example: '1'
          schema:
            type: string
        - name: limit
          in: query
          description: 1-100, defaults to 20.
          required: false
          example: '3'
          schema:
            type: string
        - name: search
          in: query
          description: Under 2 characters counts as no search. Truncated at 100, rejected past 2000.
          required: false
          example: popcorn
          schema:
            type: string
        - name: category
          in: query
          description: Category SLUG, not id.
          required: false
          example: ''
          schema:
            type: string
        - name: minPrice
          in: query
          description: Minor units, inclusive, against the product's cheapest variant.
          required: false
          example: ''
          schema:
            type: string
        - name: maxPrice
          in: query
          description: ''
          required: false
          example: ''
          schema:
            type: string
        - name: inStock
          in: query
          description: '''true'' or ''false''.'
          required: false
          example: ''
          schema:
            type: string
        - name: attributes
          in: query
          description: size:xl,l;color:black - OR within a facet, AND across facets.
          required: false
          example: ''
          schema:
            type: string
        - name: sort
          in: query
          description: relevance | newest | price_asc | price_desc | title
          required: false
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 'A ranked full-text hit: searchMode "exact".'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        slug:
                          type: string
                        shortDescription:
                          type: string
                          nullable: true
                        imageUrl:
                          type: string
                          nullable: true
                        imageAltText:
                          type: string
                          nullable: true
                        categories:
                          type: array
